include:
  local: ${CI_PROJECT_DIR}/prepared-machine-config/{{ CB_MACHINES }}.yml

variables:
# Builder variables
  SIMULATOR_MODULEFILE_PATH: "$$USER_DATA_DIR/simulator.module"
  SIMULATOR_PLANFILE_PATH: "$$USER_DATA_DIR/simulator.planfile"
  BUILDER_MODULES_DIR: "$$USER_DATA_DIR/modules"
  BUILDER_PLANFILE_DIR: "$$USER_DATA_DIR/Builder/plans"
  BUILDER_PACKAGE_DIR: "$$USER_DATA_DIR/Builder/cache/packages"
  BUILDER_SOURCE_DIR: "$$USER_DATA_DIR/Builder/cache/src"
  BUILDER_INSTALL_DIR: "$$USER_DATA_DIR/install"
  BUILDER_BUILD_DIR: "$$USER_DATA_DIR/Builder/build"
  BUILDER_LOG_DIR: "$$USER_DATA_DIR/Builder/log/"
# repository dependent variables
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository"
  RESULTS_DIR: "$$USER_DATA_DIR/results"
  SCRIPTS_DIR: "$CI_PROJECT_DIR/.gitlab-ci/scripts"
  TEMPLATES_DIR: "$CI_PROJECT_DIR/.gitlab-ci/templates"
  JUBE_RESULTS_DIR: "$$USER_DATA_DIR/jube_results"
  BENCHMARKS_DIR: "$$USER_DATA_DIR/benchmarks"
  CONFIG_FILE_PATH: "$$USER_DATA_DIR/config.yml"
  MODELS_DIR: "$$USER_DATA_DIR/models"
  OUTPUT_DIR: "$$USER_DATA_DIR/benchmark_results"
  MACHINE: "$CB_MACHINE"
# required to install gathermetadata
  GITHUB_TOKEN: "-S2LYMA21rzx3EW_gRGa"
# Empty variable to fill with the uuid.tgz names of the benchmark results
  BENCHMARK_UUIDS: None

stages: [ initialise, preparation, build, benchmarking, transfer, plotting ]

Initialise environment:
  stage: initialise
  extends: [ .initialise ]
  artifacts:
    paths:
      - "benchmarking-env"

# Must define USER_DATA_DIR
Preparation:
  stage: preparation
  extends: [ .preparation ]
  needs:
    - job: "Initialise environment"
      artifacts: true
  artifacts:
    paths:
      - "benchmarking-env"
      - "JUBE/"
      - "Builder/"
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  script:
    # Get unique id for benchmark
    - |
      export BENCHMARK_UID="$(echo $BENCHMARK_ID | sed -e 's/[^A-Za-z0-9._-]/_/g')-$(date +%Y-%m-%d-%H-%M-%S)"
    - 'set -euo pipefail'
    - 'eval USER="$GITLAB_USER_LOGIN"'
    - 'echo $USER'
    - |
      eval USER_DATA_DIR="$TEMP_DIR/$USER/${BENCHMARK_UID}"
    - 'eval SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"'
    - 'eval BENCHMARKS_DIR="$BENCHMARKS_DIR"'
    - 'eval JUBE_RESULTS_DIR="$JUBE_RESULTS_DIR"'
    - 'eval BUILDER_MODULES_DIR="$BUILDER_MODULES_DIR"'
    - 'eval BUILDER_PLANFILE_DIR="$BUILDER_PLANFILE_DIR"'
    - 'eval BUILDER_PACKAGE_DIR="$BUILDER_PACKAGE_DIR"'
    - 'eval BUILDER_SOURCE_DIR="$BUILDER_SOURCE_DIR"'
    - 'eval BUILDER_INSTALL_DIR="$BUILDER_INSTALL_DIR"'
    - 'eval BUILDER_BUILD_DIR="$BUILDER_BUILD_DIR"'
    - 'eval BUILDER_LOG_DIR="$BUILDER_LOG_DIR"'
    - 'eval CONFIG_FILE_PATH="$CONFIG_FILE_PATH"'
    - 'eval SIMULATOR_MODULEFILE_PATH="$SIMULATOR_MODULEFILE_PATH"'
    - 'eval SIMULATOR_PLANFILE_PATH="$SIMULATOR_PLANFILE_PATH"'
    - 'eval MODELS_DIR="$MODELS_DIR"'
    - 'eval OUTPUT_DIR="$OUTPUT_DIR"'
    # Create all required directories
    - 'mkdir -p "$USER_DATA_DIR" "$USER_DATA_DIR/user_files" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/metrics" "$JUBE_RESULTS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR/simulator" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$MODELS_DIR" "$OUTPUT_DIR"  "$CI_PROJECT_DIR/flipbooks"'
    # Move all artifacts to user data directory
    - 'if [[ $(realpath "$CI_PROJECT_DIR/config.yml") != $(realpath "$CONFIG_FILE_PATH") ]]; then mv "$CI_PROJECT_DIR/config.yml" "$CONFIG_FILE_PATH"; fi'
    - 'if [[ $(realpath "$CI_PROJECT_DIR/simulator.module") != $(realpath "$SIMULATOR_MODULEFILE_PATH") ]]; then mv "$CI_PROJECT_DIR/simulator.module" "$SIMULATOR_MODULEFILE_PATH"; fi'
    - 'if [[ $(realpath "$CI_PROJECT_DIR/simulator.planfile") != $(realpath "$SIMULATOR_PLANFILE_PATH") ]]; then mv "$CI_PROJECT_DIR/simulator.planfile" "$SIMULATOR_PLANFILE_PATH"; fi'
    - 'cd $CI_PROJECT_DIR'
    # install gathermetadata
    - 'python -m pip install git+https://$GITHUB_TOKEN@github.com/inm-6/gather-metadata'
    # install jube
    - 'git clone --depth=1 --branch=feature-python-exec https://github.com/JanVogelsang/JUBE.git JUBE'
    - 'cd JUBE'
    - 'pip install .'
    - 'jube --version'
    - 'cd ..'
    # install builder
    - 'git clone https://github.com/INM-6/Builder.git'
    - 'cd "${USER_DATA_DIR}/user_files"'
    - 'ln -s "${CI_PROJECT_DIR}/Builder/build.sh" "build" -v'
    # Clone simulator and model repositories
    - |
      export CB_SIMULATOR_BRANCH=$(python3 -c "import yaml; f = open('$CONFIG_FILE_PATH', 'r'); print(yaml.safe_load(f)['software_parameters']['simulator_repo_branch']);f.close()")
    - 'mkdir -p "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH"'
    - 'cp "$SIMULATOR_PLANFILE_PATH" "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH/default"'
    - 'cp "$SIMULATOR_MODULEFILE_PATH" "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH/default.module"'
    - 'python3 "$SCRIPTS_DIR/clone_models.py" "$CONFIG_FILE_PATH" "$MODELS_DIR" "$CB_MODELS"'
    # Simulator clone
    - 'git clone --single-branch --branch="$CB_SIMULATOR_BRANCH" --depth=1 "$CB_SIMULATOR_REPO" "$SIMULATOR_REPO_DIR"'
    # construct benchmarks
    - |
      echo 'CURR_PATH=$(pwd)' > "$USER_DATA_DIR/prepare.sh"
      echo 'cd "$USER_DATA_DIR/user_files"' >> "$USER_DATA_DIR/prepare.sh"
      python3 "$SCRIPTS_DIR/construct_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "$CONFIG_FILE_PATH" "$BUILDER_MODULES_DIR" "$CB_SIMULATOR_BRANCH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/metrics" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$USER_DATA_DIR/prepare.sh" "$CI_PROJECT_DIR/pipelines/${MACHINE}.yml" "$MACHINE" "$CI_PROJECT_DIR/.gitlab-ci/machine-configs/"
      echo 'cd "$CURR_PATH"' >> "$USER_DATA_DIR/prepare.sh"
    # Forward all environment variables to next stage
# Forward all environment variables to next stage
    - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
    - |
      cd "$CI_PROJECT_DIR"
      touch benchmark_variables.env
      for var in BENCHMARK_ID BENCHMARK_UID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR BENCHMARKS_DIR CB_SIMULATOR_REPO CB_SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH OUTPUT_DIR RESULTS_DIR simulator_git_commit_hash ; do
      # RESULTS_REPO_TOKEN
      if [ ! -z "${!var+x}" ]; then
          echo "${var}=${!var}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
      else
          echo "${var} not defined" 
        fi
      done
      cat "$CI_PROJECT_DIR/benchmark_variables.env"

Build:
  stage: build
  extends: [ .build ]
  needs:
    - job: "Preparation"
      artifacts: true
  artifacts:
    paths:
      - "benchmarking-env"
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  timeout: "1 day"
  script:
    - 'set -euo pipefail'
    # Prepare environment
    - !reference [ .prepare-benchmarks, environment-load ]
    # Build simulator
    - |
      export PLANFILE_PATH="$BUILDER_PLANFILE_DIR"
      export PACKAGE_CACHE="$BUILDER_PACKAGE_DIR"
      export SOURCE_PATH="$BUILDER_SOURCE_DIR"
      export BUILD_PATH="$BUILDER_BUILD_DIR"
      export TARGET_PATH="$BUILDER_INSTALL_DIR"
      export MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR"
      export LOG_PATH="$BUILDER_LOG_DIR"
      export SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"
      export SIMULATOR_MODULEFILE_PATH="$SIMULATOR_MODULEFILE_PATH"
      export SIMULATOR_PLANFILE_PATH="$SIMULATOR_PLANFILE_PATH"
    - 'export MAKE_THREADS=$(nproc)'
    # Build simulator
    - 'printenv '
    - 'build -f simulator $CB_SIMULATOR_BRANCH'
    - 'cd "${SIMULATOR_REPO_DIR}"'
    - 'export simulator_git_commit_hash=$(git rev-parse HEAD)'
    - 'rm -r "$SIMULATOR_REPO_DIR"'
    # Forward all environment variables to next stage
# Forward all environment variables to next stage
    - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
    - |
      cd "$CI_PROJECT_DIR"
      touch benchmark_variables.env
      for var in BENCHMARK_ID BENCHMARK_UID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR BENCHMARKS_DIR CB_SIMULATOR_REPO CB_SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH OUTPUT_DIR RESULTS_DIR simulator_git_commit_hash ; do
      # RESULTS_REPO_TOKEN
      if [ ! -z "${!var+x}" ]; then
          echo "${var}=${!var}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
      else
          echo "${var} not defined" 
        fi
      done
      cat "$CI_PROJECT_DIR/benchmark_variables.env"
 
Benchmarking:
  stage: benchmark
  extends: [ .parallel-benchmark, .benchmark ]
  needs:
    - job: "Build"
      artifacts: true
  artifacts:
    paths:
      - "env"
      - "results"
      - "specifications"
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  timeout: "1 day"
  script:
    # Prepare environment
    - !reference [ .prepare-benchmarks, environment-load ]
    # Run benchmarks
    # Wait until all other jube benchmarks have been started until the JUBE_BENCHMARK_ID of this subpipeline
    - 'cd $JUBE_RESULTS_DIR'
    # Wait until it's my turn to create a workpackage directory (i.e., call jube run)
    - |
      while [ $( find . -mindepth 1 -maxdepth 1 -type d | wc -l) -ne $(expr $JUBE_BENCHMARK_ID + 0) ] ; do
        sleep 3
      done
    # Start the benchmarks now
    - 'cp "$TEMPLATES_DIR/job.slurm.in" "${BENCHMARKS_DIR}/jube/job.slurm.in"'
    # If our workpackage directory exists already, we don't call jube run again, as we only need to continue (can only happen if the workflow-job was rerun by the user)
    - |
      if [ $( find . -mindepth 1 -maxdepth 1 -type d | wc -l) -ge $(expr $JUBE_BENCHMARK_ID - 1) ] ; then
        jube run --hide-animation -e "${BENCHMARKS_DIR}/jube/cb_${JUBE_BENCHMARK_FILE}_${MACHINE}.yml"
      fi
    - |
      COUNTER=0
      NUM_FAILURES=-1
      declare -A retries
      for run in "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID"/*/ ; do
          retries[$(basename $run)]=0
      done
      while jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" || [[ $NO_FAILURES -ne 0 ]] ; do
        sleep 30
        jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR" > /dev/null
        COUNTER=$((COUNTER + 1))
        if ! jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; then
          COUNTER=9
        fi
        if [ $COUNTER -eq 9 ] ; then
          sleep 3
          COUNTER=0
          NUM_FAILURES=0
          jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR"
          for run in "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID"/*/ ; do
            if [ -f "$run/work/stdout" ] ; then
              JOBID=$(grep -e 'Submitted batch job ' -e 'JobId: ' "$run/work/stdout" | head -1 | grep -oP '\d*')
              if grep -q -E 'terminated due to failure of node|Force Terminated StepId' "$run/work/stderr" ; then
                if [[ ${retries[$(basename $run)]} -lt 4 ]] ; then
                  (( ++retries[$(basename $run)] ))
                  cp "$run/work/stdout" "$run/work/stdout_NodeFailure_${retries[$(basename $run)]}"
                  cp "$run/work/stderr" "$run/work/stderr_NodeFailure_${retries[$(basename $run)]}"
                  rm -f "$run/work/ready" "$run/work/stderr" "$run/work/stdout"
                  cd "$run/work/"
                  sbatch job.slurm
                  echo "Detected node failure, rerunning job (#${retries[$(basename $run)]})"
                  (( ++NUM_FAILURES ))
                else
                  touch "$run/work/error"
                fi
              elif ! squeue -h --job $JOBID >/dev/null 2>&1 || [ $(squeue -h --job $JOBID | wc -l) = 0 ] ; then
                touch "$run/work/ready"
              fi
            fi
          done
        fi
      done
    - 'jube info --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
    - 'jube result --analyse --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
    # Copy jube benchmark files for archiving as artifacts
    - 'cp -r "$BENCHMARKS_DIR/jube" "$CI_PROJECT_DIR/specifications"'
    # Collect metadata and prepare
    - 'export RESULTS_UID=$(uuidgen)'
    - 'mkdir -p "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/"'
    - 'cp "${CONFIG_FILE_PATH}" "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/config.yml"'
    # Add actual benchmark data
    - 'cp "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID/result/result_table.dat" "$OUTPUT_DIR/${JUBE_BENCHMARK_FILE}_${MACHINE}/benchmark_results.csv"'
    # Add metadata as zip file
    - 'mkdir -v "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/metadata"'
    - 'mkdir -p "${CI_PROJECT_DIR}/results"'
    - 'chmod +x ${SCRIPTS_DIR}/pack_results.sh'
    - 'chmod +x ${SCRIPTS_DIR}/token_removal.sh'
    - 'OUTPATH="${JUBE_RESULTS_DIR}" SCRIPTS_DIR="${SCRIPTS_DIR}" CB_DATADUMP="${CI_PROJECT_DIR}/results" ${SCRIPTS_DIR}/pack_results.sh'
    # Add metadata to output archive
    - 'cd ${MODELS_DIR}/${JUBE_BENCHMARK_FILE}'
    - 'export model_git_commit_hash=$(git rev-parse HEAD)'
    # get all variables to use them in Transfer for metadata annotation
    - 'mkdir ${CI_PROJECT_DIR}/env'
    - 'printenv > "${CI_PROJECT_DIR}/env/variables.txt"'
    # Forward all environment variables to next stage
    - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
    - |
      cd "$CI_PROJECT_DIR"
      touch benchmark_variables.env
      for var in BENCHMARK_ID BENCHMARK_UID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR BENCHMARKS_DIR CB_SIMULATOR_REPO CB_SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH OUTPUT_DIR RESULTS_DIR simulator_git_commit_hash ; do
      # RESULTS_REPO_TOKEN
      if [ ! -z "${!var+x}" ]; then
          echo "${var}=${!var}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
      else
          echo "${var} not defined" 
        fi
      done
      cat "$CI_PROJECT_DIR/benchmark_variables.env"

Transfer:
  stage: transfer
  extends: [ .transfer ]
  needs: 
    - job: "Benchmarking"
      artifacts: true
  script:
    - 'set -euo pipefail'
    # get uuids of single files and store them in a variable passed to the plotting pipeline
    - 'BENCHMARK_UUID_NAMES=$(ls results/)'
    # actual data transfer
    - 'cp -r results/* "${CB_STORAGE_DIR}"'
    - 'pwd'
    - 'ls -la'

Plotting:
  stage: plotting
  trigger:
    project: 'nest/bennch/metadata_plotting'
    branch: main                                      # Git branch
  needs:
    - job: "Transfer"
      artifacts: true
