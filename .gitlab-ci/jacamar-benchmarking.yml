include:
  local: .gitlab-ci/base-benchmarking.yml


stages: [ preparation, benchmarks ]


Preparation:
  stage: preparation
  extends: [ .base-benchmarking ]
  script: [ ':' ]
  after_script:
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load all environment variables
    - !reference [ .prepare-benchmarks, environment-variables ]
    # Create all required directories
    - !reference [ .prepare-benchmarks, create-dirs ]
    # Move all artifacts to user data directory
    - !reference [ .prepare-benchmarks, artifacts ]
    # Load all modules required for preparation stage
    - !reference [ .preparation-init ]
    # Create python venv
    - 'python -m venv $USER_DATA_DIR/benchmarking-env'
    # Activate python venv
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Install all pip packages into venv specified in config file
    - !reference [ .prepare-benchmarks, pip-requirements ]
    # Patch configuration files
    - !reference [ .prepare-benchmarks, configs ]
    # Get latest bennch version
    - 'git clone --depth=1 --single-branch https://github.com/INM-6/beNNch.git $BENNCH_DIR'
    # Prepare Builder
    - 'echo "Workflow configured with the following base settings:"'
    - 'echo "WORKSPACE: $WORKSPACE"'
    - 'echo "BUILD_PATH: $BUILD_PATH"'
    - 'echo "INSTALL_PATH: $INSTALL_PATH"'
    - 'echo "BUILDER_MODULES_DIR: $BUILDER_MODULES_DIR"'
    - 'echo "BENNCH_DIR: $BENNCH_DIR"'
    - 'echo "USER_DATA_DIR: $USER_DATA_DIR"'
    - 'echo "RESULTS_DIR: $RESULTS_DIR"'
    # - 'export MODULEPATH=$BUILDER_MODULES_DIR:$MODULEPATH'  # TODO: Probably not necessary due to "module use" in bennch
    # Prepare Builder .buildrc
    - |+
      echo PLANFILE_PATH="$BUILDER_PLANFILE_DIR" > $HOME/.buildrc
      echo PACKAGE_CACHE="$BUILDER_PACKAGE_DIR" >> $HOME/.buildrc
      echo SOURCE_PATH="$BUILDER_SOURCE_DIR" >> $HOME/.buildrc
      echo BUILD_PATH="$BUILDER_BUILD_DIR" >> $HOME/.buildrc
      echo TARGET_PATH="$BUILDER_INSTALL_DIR" >> $HOME/.buildrc
      echo MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR" >> $HOME/.buildrc
      echo LOG_PATH="$BUILDER_LOG_DIR" >> $HOME/.buildrc
    # Prepare nest installation (builder plan)
    - 'alias build=/p/usersoftware/djinb33/ci-bennch/Builder/build.sh'
    - 'mkdir -p $BUILDER_PLANFILE_DIR/nest-simulator/benchmarking/'
    - 'cp $CI_PROJECT_DIR/.gitlab-ci/templates/nest-builder-template $BUILDER_PLANFILE_DIR/nest-simulator/benchmarking/default'
    - 'cp $CI_PROJECT_DIR/.gitlab-ci/templates/nest-builder-module $BUILDER_PLANFILE_DIR/nest-simulator/benchmarking/default.module'

Benchmarking:
  extends: [ .config ]
  stage: benchmarks
  variables:
    BENNCH_DIR: "$$USER_DATA_DIR/bennch"
    RESULTS_DIR: "$$USER_DATA_DIR/results"
    BUILDER_MODULES_DIR: "$$USER_DATA_DIR/modules"
    BUILDER_PLANFILE_DIR: "$$USER_DATA_DIR/Builder/plans"
    BUILDER_PACKAGE_DIR: "$$USER_DATA_DIR/Builder/cache/packages"
    BUILDER_SOURCE_DIR: "$$USER_DATA_DIR/Builder/cache/src"
    BUILDER_INSTALL_DIR: "$$USER_DATA_DIR/install"
    BUILDER_BUILD_DIR: "$$USER_DATA_DIR/Builder/build"
    BUILDER_LOG_DIR: "$$USER_DATA_DIR/Builder/log/"
  script:
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load all environment variables
    - !reference [ .prepare-benchmarks, environment-variables ]
    # Load modules on for benchmark preparation and execution
    - !reference [ .benchmarks-init ]
    # Load modules on compute node required for benchmarks
    - !reference [ .prepare-benchmarks, modules-requirements ]  # Benchmark-specific modules (for this specific machine)
    # Activate python venv
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Run benchmarks
    - !reference [ .run-benchmarks ]

  after_script:
    # Prepare results repository
    - !reference [ .prepare-benchmarks, results ]
    # Get bennchplot repository
    - !reference [ .prepare-benchmarks, analysis ]
    # Analyze results
    - !reference [ .results, analysis ]
    - |+
      if [ $CI_JOB_STATUS != 'success' ] ; then
        echo "The benchmarking process was not successful, exiting without uploading results..."
        exit 1
      fi
    # Load all environment variables
    - !reference [ .prepare-benchmarks, environment-variables ]
    # Load modules on login node required for result uploading
    - !reference [ .results-init ]
    # Upload analyzed results to specified repository
    - !reference [ .results, upload ]
