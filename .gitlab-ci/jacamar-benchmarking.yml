include:
  local: .gitlab-ci/base-benchmarking.yml

stages: [ preparation, benchmarks ]

variables:
  BENNCH_DIR: "$$USER_DATA_DIR/bennch"
  RESULTS_DIR: "$$USER_DATA_DIR/jube_results"
  CONFIG_DIR: "$$USER_DATA_DIR/configs"
  MODELS_DIR: "$$USER_DATA_DIR/models"
  BUILDER_MODULES_DIR: "$$USER_DATA_DIR/modules"
  BUILDER_PLANFILE_DIR: "$$USER_DATA_DIR/Builder/plans"
  BUILDER_PACKAGE_DIR: "$$USER_DATA_DIR/Builder/cache/packages"
  BUILDER_SOURCE_DIR: "$$USER_DATA_DIR/Builder/cache/src"
  BUILDER_INSTALL_DIR: "$$USER_DATA_DIR/install"
  BUILDER_BUILD_DIR: "$$USER_DATA_DIR/Builder/build"
  BUILDER_LOG_DIR: "$$USER_DATA_DIR/Builder/log/"
  GIT_ANNEX_DIR: "$$USER_DATA_DIR/git-annex"
  MACHINE: $CB_MACHINE


Preparation:
  stage: preparation
  extends: [ .machine-selection, .base-benchmarking ]
  tags: !reference [ .preparation-tags ]
  artifacts:
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  script:
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load all environment variables
    - !reference [ .prepare-benchmarks, environment-variables ]
    # Create all required directories
    - !reference [ .prepare-benchmarks, create-dirs ]
    # Move all artifacts to user data directory
    - !reference [ .prepare-benchmarks, artifacts ]
    # Load all modules required for preparation stage
    - !reference [ .preparation-init ]
    # Create python venv
    - 'python -m venv --system-site-packages $USER_DATA_DIR/benchmarking-env'
    # Activate python venv
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Install all pip packages into venv specified in config file
    - !reference [ .prepare-benchmarks, pip-requirements ]
    # Get latest bennch version
    - 'git clone --depth=1 --single-branch https://github.com/JanVogelsang/beNNch.git $BENNCH_DIR'
    # Patch configuration files
    - !reference [ .prepare-benchmarks, configs ]
    # Prepare Builder
    - 'echo "Workflow configured with the following base settings:"'
    - 'echo "WORKSPACE: $WORKSPACE"'
    - 'echo "BUILD_PATH: $BUILD_PATH"'
    - 'echo "INSTALL_PATH: $INSTALL_PATH"'
    - 'echo "BUILDER_MODULES_DIR: $BUILDER_MODULES_DIR"'
    - 'echo "BENNCH_DIR: $BENNCH_DIR"'
    - 'echo "USER_DATA_DIR: $USER_DATA_DIR"'
    - 'echo "RESULTS_DIR: $RESULTS_DIR"'
    # Prepare Builder .buildrc
    - 'BUILDER_CONFIG_PATH=$USER_DATA_DIR/.buildrc'
    - |+
      echo PLANFILE_PATH="$BUILDER_PLANFILE_DIR" > $BUILDER_CONFIG_PATH
      echo PACKAGE_CACHE="$BUILDER_PACKAGE_DIR" >> $BUILDER_CONFIG_PATH
      echo SOURCE_PATH="$BUILDER_SOURCE_DIR" >> $BUILDER_CONFIG_PATH
      echo BUILD_PATH="$BUILDER_BUILD_DIR" >> $BUILDER_CONFIG_PATH
      echo TARGET_PATH="$BUILDER_INSTALL_DIR" >> $BUILDER_CONFIG_PATH
      echo MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR" >> $BUILDER_CONFIG_PATH
      echo LOG_PATH="$BUILDER_LOG_DIR" >> $BUILDER_CONFIG_PATH
    - 'mkdir -p $USER_DATA_DIR/bin'
    - 'ln -s $BUILDER_DIR/build.sh $USER_DATA_DIR/bin/build'
    - 'export PATH=$USER_DATA_DIR/bin:$PATH'
    # Prepare nest installation (builder plan)
    - 'mkdir -p $BUILDER_PLANFILE_DIR/nest-simulator/$SIMULATOR_BRANCH/'
    - 'cp $CI_DIR/templates/nest-builder-template $BUILDER_PLANFILE_DIR/nest-simulator/$SIMULATOR_BRANCH/default'
    - 'cp $CI_DIR/templates/nest-builder-module $BUILDER_PLANFILE_DIR/nest-simulator/$SIMULATOR_BRANCH/default.module'
    - |+
      for var in CB_RUNNER_ACCOUNT CB_PROJECT USER_DATA_DIR WORKSPACE_DIR BENNCH_DIR USER_DATA_DIR SIMULATOR_REPO SIMULATOR_BRANCH SIMULATOR_REPO_DIR RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR GIT_ANNEX_DIR CONFIG_DIR MODELS_DIR BUILDER_CONFIG_PATH ; do
        eval val=\$$var
        echo "${var}=${val}" >> $CI_PROJECT_DIR/benchmark_variables.env
      done

Benchmarking:
  tags: !reference [ .benchmark-tags ]
  needs:
    - job: "Preparation"
      artifacts: true
  stage: benchmarks
  artifacts:
    paths:
      - ${SIMULATOR_BRANCH}-nodes.slides.html
      - ${SIMULATOR_BRANCH}-threads.slides.html
      - configs
    when: on_success
  variables:
    # TODO: How much time is really required here? Should this also be a config parameter maybe?
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=00:15:00 --nodes=1"
  script:
    - !reference [ .prepare-benchmarks, build ]
  after_script:
    - |+
      if [ $CI_JOB_STATUS != 'success' ] ; then
        echo "Compilation not successful, exiting without running benchmarks..."
        exit 1
      fi
    # Copy configs for archiving as artifacts
    - 'cp -r $BENNCH_DIR/config/$MACHINE $CI_PROJECT_DIR/configs'
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load modules on for benchmark preparation and execution
    - !reference [ .benchmarks-init ]
    # Load user-defined modules on compute node required for benchmarks
    - !reference [ .prepare-benchmarks, modules-requirements ]
    # Add builder to path
    - 'export PATH=$USER_DATA_DIR/bin:$PATH'
    # Activate python venv
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Run benchmarks
    - !reference [ .run-benchmarks ]
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load modules on login node required for result uploading and make git-annex available
    - !reference [ .results-init ]
    # Activate python venv (after loading modules to use venv interpreter)
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Make bennchplot available (also in Jupyter)
    - 'echo $BENNCHPLOT_DIR'
    - 'eval BENNCHPLOT_DIR=$BENNCHPLOT_DIR'
    - 'echo $BENNCHPLOT_DIR'
    - 'export PYTHONPATH=$PYTHONPATH:$BENNCHPLOT_DIR'
    # Prepare results repository
    - !reference [ .prepare-benchmarks, results ]
    # Analyze results
    - !reference [ .results, analysis ]
    # Upload analyzed results to specified repository
    - !reference [ .results, upload ]
    # Generate flipbook
    # TODO: Fix
    # - 'pip install --ignore-installed ipykernel jupyter nbformat nbconvert'
    # - 'python3 -m ipykernel install --name=benchmarking-env'
    - !reference [ .results, flipbook ]
    - 'chmod -R 777 $USER_DATA_DIR/bennch/results/.git'  # Todo: Probably not required, needs fix
    - 'rm -rf $USER_DATA_DIR'
