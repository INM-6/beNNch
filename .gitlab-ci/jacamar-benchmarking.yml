include:
  local: .gitlab-ci/base-benchmarking.yml


variables:
  JUBE_RESULTS_DIR: "$$USER_DATA_DIR/jube_results"
  BENCHMARKS_DIR: "$$USER_DATA_DIR/benchmarks"
  CONFIG_FILE_PATH: "$$USER_DATA_DIR/config.yml"
  MODELS_DIR: "$$USER_DATA_DIR/models"
  BUILDER_MODULES_DIR: "$$USER_DATA_DIR/modules"
  BUILDER_PLANFILE_DIR: "$$USER_DATA_DIR/Builder/plans"
  BUILDER_PACKAGE_DIR: "$$USER_DATA_DIR/Builder/cache/packages"
  BUILDER_SOURCE_DIR: "$$USER_DATA_DIR/Builder/cache/src"
  BUILDER_INSTALL_DIR: "$$USER_DATA_DIR/install"
  BUILDER_BUILD_DIR: "$$USER_DATA_DIR/Builder/build"
  BUILDER_LOG_DIR: "$$USER_DATA_DIR/Builder/log/"
  BUILDER_CONFIG_PATH: "$$USER_DATA_DIR/.buildrc"
  MACHINE: "$CB_MACHINE"


Preparation:
  extends: [ .base-benchmarking, .preparation ]
  artifacts:
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  script:
    - 'echo $CB_BUILD_TIME_LIMIT'
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load all environment variables
    - |
      eval USER_DATA_DIR="$TEMP_DIR/$USER/$(echo $BENCHMARK_ID | sed -e 's/[^A-Za-z0-9._-]/_/g')-$(date +%d-%m-%y-%H-%M-%S)"
    - !reference [ .prepare-benchmarks, environment-variables ]
    # Create all required directories
    - !reference [ .prepare-benchmarks, create-dirs ]
    # Move all artifacts to user data directory
    - !reference [ .prepare-benchmarks, artifacts ]
    # Load user-defined modules
    - !reference [ .prepare-benchmarks, modules-requirements ]
    # Create python venv
    - 'python -m venv --system-site-packages "$USER_DATA_DIR/benchmarking-env"'
    # Activate python venv
    - 'source "$USER_DATA_DIR/benchmarking-env/bin/activate"'
    # Install all pip packages into venv specified in config file
    - 'export PYTHONNOUSERSITE=1'
    - '"$USER_DATA_DIR/benchmarking-env/bin/pip" install jupyter nbconvert'  # TODO
    - !reference [ .prepare-benchmarks, pip-requirements ]
    # TODO: Metadata
    # - 'pip install git+https://github.com/INM-6/gather-metadata.git'
    # Prepare Builder .buildrc
    - |
      echo PLANFILE_PATH="$BUILDER_PLANFILE_DIR" > "$BUILDER_CONFIG_PATH"
      echo PACKAGE_CACHE="$BUILDER_PACKAGE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo SOURCE_PATH="$BUILDER_SOURCE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo BUILD_PATH="$BUILDER_BUILD_DIR" >> "$BUILDER_CONFIG_PATH"
      echo TARGET_PATH="$BUILDER_INSTALL_DIR" >> "$BUILDER_CONFIG_PATH"
      echo MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR" >> "$BUILDER_CONFIG_PATH"
      echo LOG_PATH="$BUILDER_LOG_DIR" >> "$BUILDER_CONFIG_PATH"
    - 'mkdir -p "$USER_DATA_DIR/bin"'
    - 'ln -s "$BUILDER_DIR/build.sh" "$USER_DATA_DIR/bin/build"'
    - 'export PATH="$USER_DATA_DIR/bin:$PATH"'
    # Prepare simulator installation (builder plan)
    - 'mkdir -p "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH"'
    # TODO: Make this generic and not NEST-specific
    - 'cp "$TEMPLATES_DIR/nest-builder-template" "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH/default"'
    - 'cp "$TEMPLATES_DIR/nest-builder-module" "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH/default.module"'
    # Clone simulator and model repositories
    - !reference [ .prepare-benchmarks, clone-repositories ]
    # Construct JUBE benchmark files from provided config
    - !reference [ .prepare-benchmarks, construct-benchmarks ]
    - 'echo "source $USER_DATA_DIR/benchmarking-env/bin/activate" >> $USER_DATA_DIR/prepare.sh'
    # Forward all environment variables to next stage
    - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
    - |
      for var in BENCHMARK_ID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR WORKSPACE_DIR BENCHMARKS_DIR BENNCHPLOT_DIR SIMULATOR_REPO SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR GIT_ANNEX_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH NEST_VERSION ; do
        eval val=\$$var
        echo "${var}=${val}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
      done


Build:
  extends: [ .build ]
  needs:
    - job: "Preparation"
      artifacts: true
  artifacts:
    reports:
      dotenv: benchmark_variables.env
    when: on_success
  script:
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load user-defined modules
    - !reference [ .prepare-benchmarks, modules-requirements ]
    # Activate python venv
    - 'source $USER_DATA_DIR/benchmarking-env/bin/activate'
    # Add builder to path
    - 'export PATH=$USER_DATA_DIR/bin:$PATH'
    # Build simulator
    - 'export MAKE_THREADS=$(nproc)'
    - !reference [ .prepare-benchmarks, build-simulator ]
    - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
    - |
      for var in BENCHMARK_ID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR WORKSPACE_DIR BENCHMARKS_DIR BENNCHPLOT_DIR SIMULATOR_REPO SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR GIT_ANNEX_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH NEST_VERSION ; do
        eval val=\$$var
        echo "${var}=${val}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
      done
  
Benchmarking:
  extends: [ .benchmark ]
  needs:
    - job: "Build"
      artifacts: true
  artifacts:
    paths:
      - "flipbooks"
      - "configs"
    when: on_success
  script:
    # Load all modules required for continuous benchmarking in general and prepare environment
    - !reference [ .environment-init ]
    # Load user-defined modules
    - !reference [ .prepare-benchmarks, modules-requirements ]
    # Activate python venv
    - 'source "$USER_DATA_DIR/benchmarking-env/bin/activate"'
    # Run benchmarks
    - !reference [ .run-benchmarks ]
    # Make bennchplot available (also in Jupyter)
    - 'export PYTHONPATH="$PYTHONPATH:$BENNCHPLOT_DIR"'
    # Prepare results repository
    - !reference [ .prepare-benchmarks, results ]
    # Collect and upload metadata and results
    - !reference [ .metadata ]
    # Generate flipbook
    - !reference [ .flipbook ]
    # Copy jube benchmark files for archiving as artifacts
    - 'cp -r "$BENCHMARKS_DIR/jube" "$CI_PROJECT_DIR/specifications"'
    # - 'chmod -R 777 "$USER_DATA_DIR/bennch/results/.git"'  # Todo: Probably not required, needs fix
    # - 'rm -rf $USER_DATA_DIR'
