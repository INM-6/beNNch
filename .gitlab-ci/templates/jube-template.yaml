include-path:
  - ../helpers/
  - ../config/

outpath: ../../benchmark_results/

parameterset:
  name: model_commands

fileset:
  name: model_files

substituteset:
  name: model_substitutions

step:
  - name: bench
    use:
    - model_commands, model_files, model_substitutions
    - from: user_config.yaml
      _: user_config
    - from: MODEL_CONFIG
      _: file_paths,model_parameters,machine_parameters,software_parameters
    - from: helpers.yaml
      _: slurm_bench,run_benchmark,files,sub_bench_job,scaling_experiment,init_job_file_variables
    do:
      done_file: $ready_file
      _: $submit_cmd $job_file

analyser:
  name: analyse
  use:
    - from: helpers.yaml
      _: timer_pattern
  analyse:
    step: bench
    file: timer_data.txt

result:
  name: result
  use: analyse
  table:
    name: result_table
    style: csv
    sort: number
