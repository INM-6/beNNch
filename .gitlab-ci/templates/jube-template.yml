parameterset: []
 
fileset:
  name: bench_files
  copy: 
    - job.slurm.in

substituteset:
  - name: slurm_jobfile
    iofile: {in: job.slurm.in, out: job.slurm}
    sub:
      - {source: "#PARTITION#", dest: $partition}
      - {source: "#NODES#", dest: $num_nodes}
      - {source: "#NTASKS_PER_NODE#", dest: $tasks_per_node}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#TIME#", dest: $walltime}
      - {source: "#COMMANDS#", dest: $exec_bench}
      - {source: "#ACCOUNT#", dest: $account}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#MODULES_DIR#", dest: $buildermod}
      - {source: "#BRANCH#", dest: $simulator_branch}
      - {source: "#PREPARE_FILE#", dest: $prepare_file_path}
      - {source: "#EXTRA_SBATCH_FLAGS#", dest: $extra_sbatch_flags}
  - name: bench_substitutions
    sub:
      - {source: "{num_vps}", dest: $num_vps}
      - {source: "{num_tasks}", dest: $num_tasks}

step:
  - name: bench
    use:
      - bench_parameters, run_benchmark, bench_files, bench_substitutions, slurm_jobfile, user_config, model_parameters, machine_parameters, software_parameters, machine_config
    do:
      done_file: ready
      error_file: error
      _: sbatch job.slurm

analyser:
  name: analyse
  use: bench_patternset
  analyse:
    step: bench
    file: timer_data.txt

result:
  name: result
  use: analyse
  table:
    name: result_table
    style: csv
