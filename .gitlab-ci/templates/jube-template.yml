parameterset:
  - name: bench_parameters
    parameter:
      - {name: num_vps, type: int, mode: python, "_": "$tasks_per_node * $threads_per_task * $num_nodes"}
      - {name: num_tasks, type: int, mode: python, "_": "$tasks_per_node * $num_nodes"}
      - name: cpu_bind_mask
        type: string
        separator: ;
        mode: bash
        "_": |
	cpu_bind_masks=()
	bits_per_task=$THREADS_PER_TASK  # Replace with the actual number of threads per task
	tasks_per_node=$TASKS_PER_NODE  # Replace with the actual number of tasks per node
	current_block=0
	num_blocks=0
	current_block_free=4

	for ((i=0; i<tasks_per_node; i++)); do
	    bits_left=$bits_per_task
	    mask="0x"
	    
	    while ((bits_left >= current_block_free)); do
		mask_bits=$(printf "%0${current_block_free}d" $(echo "obase=2; 2^${current_block_free} - 1" | bc))
		mask_hex=$(printf "%X" "$((2#$mask_bits))")
		mask+="$mask_hex"
		bits_left=$((bits_left - current_block_free))
		num_blocks=$((num_blocks + 1))
	    done
	    
	    if ((bits_left > 0)); then
		mask_bits=$(printf "%0${bits_left}d" $(echo "obase=2; 2^${bits_left} - 1" | bc))
		mask_bits=$(printf "%0${current_block_free}d" "$mask_bits")
		mask_hex=$(printf "%X" "$((2#$mask_bits))")
		mask+="$mask_hex"
	    fi

	    # Padding for the end of the mask
	    if ((current_block > 0)); then
		mask=$(printf "%s%0${current_block}X" "$mask" 0)
	    fi
	    
	    cpu_bind_masks+=("$mask")
	    current_block=$((current_block + num_blocks))
	    num_blocks=0
	done

	cpu_bind_mask=$(IFS=,; echo "${cpu_bind_masks[*]}")
	echo "${cpu_bind_masks[*]}"
  - name: run_benchmark
    parameter:
      - name: exec_bench
        separator: ;
        _: |
          ${optional_run_command}
          srun --cpu-bind=mask_cpu:${cpu_bind_mask} python ${run_file} ${run_args}
          srun -n 1 --nodes 1 python ${scripts_dir}/collect_timer_data.py ${metrics_path} ${jube_wp_abspath} ${log_path}
           
fileset:
  name: bench_files
  copy: 
    - job.slurm.in

substituteset:
  - name: slurm_jobfile
    iofile: {in: job.slurm.in, out: job.slurm}
    sub:
      - {source: "#PARTITION#", dest: $partition}
      - {source: "#NODES#", dest: $num_nodes}
      - {source: "#NTASKS_PER_NODE#", dest: $tasks_per_node}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#TIME#", dest: $walltime}
      - {source: "#COMMANDS#", dest: $exec_bench}
      - {source: "#ACCOUNT#", dest: $account}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#MODULES_DIR#", dest: $buildermod}
      - {source: "#BRANCH#", dest: $simulator_branch}
      - {source: "#PREPARE_FILE#", dest: $prepare_file_path}
      - {source: "#EXTRA_SLURM_FLAGS#", dest: $extra_slurm_flags}
  - name: bench_substitutions
    sub:
      - {source: "{num_vps}", dest: $num_vps}
      - {source: "{num_tasks}", dest: $num_tasks}

step:
  - name: bench
    use:
      - bench_parameters, run_benchmark, bench_files, bench_substitutions, slurm_jobfile, user_config, model_parameters, machine_parameters, software_parameters, machine_config
    do:
      done_file: ready
      error_file: error
      _: sbatch job.slurm

analyser:
  name: analyse
  use: bench_patternset
  analyse:
    step: bench
    file: timer_data.txt

result:
  name: result
  use: analyse
  table:
    name: result_table
    style: csv
