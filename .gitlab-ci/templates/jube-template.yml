parameterset:
  - name: bench_parameters
    parameter:
      - {name: scale, mode: python, type: float, "_": $scale_N*$num_nodes if "$scaling_type" == "weak" else $scale_N}
      - {name: num_vps, type: int, mode: python, "_": $tasks_per_node * $threads_per_task * $num_nodes}
      - {name: num_tasks, type: int, mode: python, "_": $tasks_per_node * $num_nodes}
  - name: run_benchmark
    parameter:
      - name: exec_bench
        separator: ;
        _: |
          module use ${buildermod}
          module load ${simulator}/${version}/${variant}
          export OMP_NUM_THREADS=${threads_per_task}
          export OMP_DISPLAY_ENV=VERBOSE
          export OMP_DISPLAY_AFFINITY=TRUE
          export OMP_PROC_BIND=TRUE
          ${optional_run_command}
          srun --cpus-per-task=${threads_per_task} ${affinity} python ${run_file} ${run_args}
          srun -n 1 --nodes 1 python ${scripts_dir}/collect_timer_data.py ${metrics_path} ${jube_wp_abspath} ${log_path}

fileset:
  name: bench_files
  copy: 
    - job.slurm.in

substituteset:
  - name: slurm_jobfile
    iofile: {in: job.slurm.in, out: job.slurm}
    sub:
      - {source: "#PARTITION#", dest: $partition}
      - {source: "#NODES#", dest: $num_nodes}
      - {source: "#NTASKS_PER_NODE#", dest: $tasks_per_node}
      - {source: "#TIME#", dest: $walltime}
      - {source: "#COMMANDS#", dest: $exec_bench}
      - {source: "#ACCOUNT#", dest: $account}
  - name: bench_substitutions
    sub:
    # TODO: How to deal with scale properly?
      - {source: "{scale}", dest: $scale}
      - {source: "{scaling_type}", dest: $scaling_type}
      - {source: "{num_vps}", dest: $num_vps}
      - {source: "{num_tasks}", dest: $num_tasks}
      - {source: "{num_nodes}", dest: $num_nodes}
      - {source: "{tasks_per_node}", dest: $tasks_per_node}
      - {source: "{threads_per_task}", dest: $threads_per_task}

step:
  - name: bench
    use:
      - bench_parameters, run_benchmark, bench_files, bench_substitutions, slurm_jobfile, user_config, model_parameters, machine_parameters, software_parameters
    do:
      done_file: ready
      _: sbatch job.slurm

analyser:
  name: analyse
  use: bench_patternset
  analyse:
    step: bench
    file: timer_data.txt

result:
  name: result
  use: analyse
  table:
    name: result_table
    style: csv
