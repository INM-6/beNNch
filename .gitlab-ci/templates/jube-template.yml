parameterset:
  - name: bench_parameters
    parameter:
      - {name: num_vps, type: int, mode: python, "_": "$tasks_per_node * $threads_per_task * $num_nodes"}
      - {name: num_tasks, type: int, mode: python, "_": "$tasks_per_node * $num_nodes"}
      - name: cpu_bind_mask
        type: string
        separator: ;
        mode: python
        "_": |
           exec("cpu_bind_masks = list()\nbits_per_task = $threads_per_task\ncurrent_block = 0\nnum_blocks = 0\ncurrent_block_free = 4\nfor _ in range($tasks_per_node):\n    bits_left = bits_per_task\n    cpu_bind_masks.append('0x')\n    while bits_left >= current_block_free:\n        mask = '1'*current_block_free\n        cpu_bind_masks[-1] += hex(int(mask, 2))[2:].upper()\n        bits_left -= current_block_free\n        current_block_free = 4\n        num_blocks += 1\n    if bits_left > 0:\n        mask = '1'*bits_left + '0'*(4-bits_left)\n        cpu_bind_masks[-1] += hex(int(mask, 2))[2:].upper()\n        current_block_free -= bits_left\n    cpu_bind_masks[-1] += '0'*current_block\n    current_block += num_blocks\n    num_blocks = 0");return ",".join(cpu_bind_masks)
  - name: run_benchmark
    parameter:
      - name: exec_bench
        separator: ;
        _: |
          ${optional_run_command}
          srun --cpu-bind=mask_cpu:${cpu_bind_mask} python ${run_file} ${run_args}
          srun -n 1 --nodes 1 python ${scripts_dir}/collect_timer_data.py ${metrics_path} ${jube_wp_abspath} ${log_path}

fileset:
  name: bench_files
  copy: 
    - job.slurm.in

substituteset:
  - name: slurm_jobfile
    iofile: {in: job.slurm.in, out: job.slurm}
    sub:
      - {source: "#PARTITION#", dest: $partition}
      - {source: "#NODES#", dest: $num_nodes}
      - {source: "#NTASKS_PER_NODE#", dest: $tasks_per_node}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#TIME#", dest: $walltime}
      - {source: "#COMMANDS#", dest: $exec_bench}
      - {source: "#ACCOUNT#", dest: $account}
      - {source: "#THREADS_PER_TASK#", dest: $threads_per_task}
      - {source: "#MODULES_DIR#", dest: $buildermod}
      - {source: "#BRANCH#", dest: $simulator_branch}
      - {source: "#PREPARE_FILE#", dest: $prepare_file_path}
  - name: bench_substitutions
    sub:
      - {source: "{num_vps}", dest: $num_vps}
      - {source: "{num_tasks}", dest: $num_tasks}

step:
  - name: bench
    use:
      - bench_parameters, run_benchmark, bench_files, bench_substitutions, slurm_jobfile, user_config, model_parameters, machine_parameters, software_parameters
    do:
      done_file: ready
      _: sbatch job.slurm

analyser:
  name: analyse
  use: bench_patternset
  analyse:
    step: bench
    file: timer_data.txt

result:
  name: result
  use: analyse
  table:
    name: result_table
    style: csv
