variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"
  SCRIPTS_DIR: "$CI_PROJECT_DIR/.gitlab-ci/scripts"
  TEMPLATES_DIR: "$CI_PROJECT_DIR/.gitlab-ci/templates"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true
  when: manual

# Requires git, python3, and pyyaml
.prepare-benchmarks:
  # Move all artifacts to user data directory
  artifacts:
    - 'if [[ $(realpath "$CI_PROJECT_DIR/config.yml") != $(realpath "$CONFIG_FILE_PATH") ]]; then mv "$CI_PROJECT_DIR/config.yml" "$CONFIG_FILE_PATH"; fi'
  environment-variables:
    # TODO
    #- |
    #  for var in SIMULATOR_REPO_DIR JUBE_RESULTS_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR MODELS_DIR BENCHMARKS_DIR ; do
    #    eval "$var"='${$var}'
    #  done
    - 'eval BENNCH_DIR="$BENNCH_DIR"'
    - 'eval SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"'
    - 'eval JUBE_RESULTS_DIR="$JUBE_RESULTS_DIR"'
    - 'eval ANALYSIS_DIR="$ANALYSIS_DIR"'
    - 'eval BUILDER_CONFIG_PATH="$BUILDER_CONFIG_PATH"'
    - 'eval BUILDER_MODULES_DIR="$BUILDER_MODULES_DIR"'
    - 'eval BUILDER_PLANFILE_DIR="$BUILDER_PLANFILE_DIR"'
    - 'eval BUILDER_PACKAGE_DIR="$BUILDER_PACKAGE_DIR"'
    - 'eval BUILDER_SOURCE_DIR="$BUILDER_SOURCE_DIR"'
    - 'eval BUILDER_INSTALL_DIR="$BUILDER_INSTALL_DIR"'
    - 'eval BUILDER_BUILD_DIR="$BUILDER_BUILD_DIR"'
    - 'eval BUILDER_LOG_DIR="$BUILDER_LOG_DIR"'
    - 'eval CONFIG_FILE_PATH="$CONFIG_FILE_PATH"'
    - 'eval MODELS_DIR="$MODELS_DIR"'
    - 'eval BENCHMARKS_DIR="$BENCHMARKS_DIR"'
  create-dirs:
    - 'mkdir -p "$USER_DATA_DIR" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/metrics" "$JUBE_RESULTS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$MODELS_DIR"'
  clone-repositories:
    - 'build --get --silent simulator $SIMULATOR_BRANCH'
    - 'python3 "$SCRIPTS_DIR/clone_models.py" "$CONFIG_FILE_PATH" "$MODELS_DIR" "$CB_MODELS"'
  apt-requirements:
    - |
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" apt "$CONFIG_FILE_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        apt-get install -y $REQUIREMENTS
      fi
  pip-requirements:
    - |
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" pip "$CONFIG_FILE_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        pip install $REQUIREMENTS
      fi
  modules-requirements:
    - |
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" modules "$CONFIG_FILE_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        module load $REQUIREMENTS
      fi
  results:
    # Set result repository
    - 'git clone --single-branch --branch="$RESULTS_BRANCH" --depth=1 "$RESULTS_REPO_URL" "$USER_DATA_DIR/results"'
    - 'cd $USER_DATA_DIR/results'
    - 'git annex init'
  build-simulator:
    - 'build -f simulator $SIMULATOR_BRANCH'
  construct-benchmarks:
    - 'touch $USER_DATA_DIR/prepare.sh'
    - 'python3 "$SCRIPTS_DIR/construct_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "$CONFIG_FILE_PATH" "$BUILDER_MODULES_DIR" "$SIMULATOR_BRANCH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/metrics" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$USER_DATA_DIR/prepare.sh" "$MACHINE"'

# Requires jube
.run-benchmarks:
  # TODO: Split this up into multiple jobs and make each benchmark (model) run in a parallel job so the analysis for a benchmark can start even if the others didn't finish yet
  - 'cp "$TEMPLATES_DIR/job.slurm.in" "$BENCHMARKS_DIR/jube/job.slurm.in"'
  - |
    for benchmark in "$BENCHMARKS_DIR"/jube/cb_*_"$MACHINE".yml ; do
      jube run --hide-animation -e $benchmark
    done
  - |
    while jube status --id=all "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; do
      sleep 30
      jube continue --error --id=all --hide-animation "$JUBE_RESULTS_DIR"
    done
  - 'jube result --analyse --id=all "$JUBE_RESULTS_DIR"'

