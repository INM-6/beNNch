variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"
  SCRIPTS_DIR: "$CI_PROJECT_DIR/.gitlab-ci/scripts"
  TEMPLATES_DIR: "$CI_PROJECT_DIR/.gitlab-ci/templates"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true
  when: manual

# Requires git, python3, and pyyaml
.prepare-benchmarks:
  # Move all artifacts to user data directory
  artifacts:
    - 'mv "$CI_PROJECT_DIR/config_repository/"* "$CONFIG_DIR"'
  environment-variables:
    - |+
      for var in WORKSPACE_DIR SIMULATOR_REPO_DIR JUBE_RESULTS_DIR BUILDER_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR GIT_ANNEX_DIR CONFIG_DIR MODELS_DIR BENNCHPLOT_DIR BENCHMARKS_DIR ; do
        eval val=\$$var
      done
  create-dirs:
    - 'echo $USER_DATA_DIR'
    - 'echo $BENCHMARKS_DIR'
    - 'echo $CONFIG_DIR'
    - 'mkdir -p "$USER_DATA_DIR" "$WORKSPACE_DIR" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/configs/$MACHINE" "$JUBE_RESULTS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$CONFIG_DIR" "$MODELS_DIR"'
  clone-repositories:
    - 'git clone --single-branch --branch="$SIMULATOR_BRANCH" --depth=1 "$SIMULATOR_REPO" "$SIMULATOR_REPO_DIR"'
    - 'python3 "$SCRIPTS_DIR/clone_models.py" "${CONFIG_DIR}/$CONFIG_PATH" "$MODELS_DIR" "$CB_MODELS"'
  apt-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" apt "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        apt-get install -y $REQUIREMENTS
      fi
  pip-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" pip "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        pip3 install $REQUIREMENTS
      fi
  modules-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" modules "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        module load $REQUIREMENTS
      fi
  configs:
    - 'python3 "$SCRIPTS_DIR/patch_configs.py" "${CONFIG_DIR}/$CONFIG_PATH" "$BENCHMARKS_DIR/configs/$MACHINE" "$BUILDER_MODULES_DIR" "$SIMULATOR_BRANCH" "$MACHINE"'
  results:
    # Set result repository
    - 'git clone --single-branch --branch="$RESULTS_BRANCH" --depth=1 "$RESULTS_REPO_URL" "$USER_DATA_DIR/results"'
    - 'cd $USER_DATA_DIR/results'
    - 'git annex init'
  build-simulator:
    # TODO: Make this generic to not only work for NEST
    - 'build -f nest-simulator $SIMULATOR_BRANCH'
  build-benchmarks:
    - 'python3 "$SCRIPTS_DIR/build_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "${CONFIG_DIR}/$CONFIG_PATH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/configs/$MACHINE" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$MACHINE"'

# Requires jube
.run-benchmarks:
  - 'cp "$TEMPLATES_DIR/job.slurm.in" "$BENCHMARKS_DIR/jube/job.slurm.in"'
  - |+
    for benchmark in "$BENCHMARKS_DIR/jube/cb_"*"${MACHINE}.yml" ; do
      jube run --hide-animation -e --include-path="$BENCHMARKS_DIR/configs/$MACHINE" $benchmark
    done
  - |+
    shopt
    while jube status --id=all "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; do
      sleep 30
      jube continue --error --id=all --hide-animation "$JUBE_RESULTS_DIR"
    done
  - 'jube result --analyse --id=all "$JUBE_RESULTS_DIR"'

