variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"
  CI_DIR: "$CI_PROJECT_DIR/.gitlab-ci"
  SCRIPTS_DIR: "$CI_DIR/scripts"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true

.machine-selection:
  when: manual
  rules:
    - if: $CB_MACHINES =~ $CB_MACHINE  # Only make benchmark for machine runnable if configuration was provided for it

# Requires git, python3 and pyyaml
.prepare-benchmarks:
  # Move all artifacts to user data directory
  artifacts:
    - |+
      mv $CI_PROJECT_DIR/repository/* $SIMULATOR_REPO_DIR
      mv $CI_PROJECT_DIR/config_repository/* $CONFIG_DIR
      mv $CI_PROJECT_DIR/model_repos/* $MODELS_DIR
  environment-variables:
    - 'eval USER_DATA_DIR=$TEMP_DIR/$USER/$(date +%s)'
    - 'eval WORKSPACE_DIR=$WORKSPACE_DIR'
    - 'eval BENNCH_DIR=$BENNCH_DIR'
    - 'eval USER_DATA_DIR=$USER_DATA_DIR'
    - 'eval SIMULATOR_REPO_DIR=$SIMULATOR_REPO_DIR'
    - 'eval RESULTS_DIR=$RESULTS_DIR'
    - 'eval BUILDER_DIR=$BUILDER_DIR'
    - 'eval BUILDER_MODULES_DIR=$BUILDER_MODULES_DIR'
    - 'eval BUILDER_PLANFILE_DIR=$BUILDER_PLANFILE_DIR'
    - 'eval BUILDER_PACKAGE_DIR=$BUILDER_PACKAGE_DIR'
    - 'eval BUILDER_SOURCE_DIR=$BUILDER_SOURCE_DIR'
    - 'eval BUILDER_INSTALL_DIR=$BUILDER_INSTALL_DIR'
    - 'eval BUILDER_BUILD_DIR=$BUILDER_BUILD_DIR'
    - 'eval BUILDER_LOG_DIR=$BUILDER_LOG_DIR'
    - 'eval GIT_ANNEX_DIR=$GIT_ANNEX_DIR'
    - 'eval CONFIG_DIR=$CONFIG_DIR'
    - 'eval MODELS_DIR=$MODELS_DIR'
  create-dirs:
    - 'mkdir -p $USER_DATA_DIR $WORKSPACE_DIR $SIMULATOR_REPO_DIR $BENNCH_DIR $BUILDER_DIR $BUILDER_MODULES_DIR $BUILDER_PLANFILE_DIR $BUILDER_PACKAGE_DIR $BUILDER_SOURCE_DIR $BUILDER_INSTALL_DIR $BUILDER_BUILD_DIR $BUILDER_LOG_DIR $GIT_ANNEX_DIR $CONFIG_DIR $MODELS_DIR'
  apt-requirements:
    - |+
      REQUIREMENTS=$(python3 $SCRIPTS_DIR/get_requirements_from_config.py apt ${CONFIG_DIR}/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        apt-get install -y $REQUIREMENTS
      fi
  pip-requirements:
    - |+
      REQUIREMENTS=$(python3 $SCRIPTS_DIR/get_requirements_from_config.py pip ${CONFIG_DIR}/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        pip3 install --user $REQUIREMENTS
      fi
  modules-requirements:
    - |+
      REQUIREMENTS=$(python3 $SCRIPTS_DIR/get_requirements_from_config.py modules ${CONFIG_DIR}/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        module load $REQUIREMENTS
      fi
  configs:
    - |+
      rm -rf $BENNCH_DIR/config/* $BENNCH_DIR/benchmarks/*
      python3 $SCRIPTS_DIR/patch_configs.py ${CONFIG_DIR}/$CONFIG_PATH $BENNCH_DIR/benchmarks $BENNCH_DIR/config/$MACHINE $BUILDER_MODULES_DIR $BENNCH_DIR $MODELS_DIR $SIMULATOR_BRANCH $MACHINE
  results:
    # Set result repository
    - 'cd $BENNCH_DIR'
    - 'git submodule set-url -- results $RESULTS_REPO_URL'
    - 'git submodule set-branch --branch $RESULTS_BRANCH -- results'
    - 'git submodule update --depth=1 --init --recursive --remote -- results'
    - 'cd results'
    - 'git pull origin $RESULTS_BRANCH'
    - 'git checkout $RESULTS_BRANCH'
    - 'git annex init'
    - 'git annex sync'
  analysis:
    # Bennchplot package
    - 'cd $BENNCH_DIR'
    - |+
      git submodule set-url -- plot "https://github.com/JanVogelsang/beNNch-plot.git"
    - 'git submodule update --depth=1 --init --recursive --remote -- plot'
    # TODO: Should this really be always installed or is this up to the user/machine?
    - |+
      pip install -e plot --user


# Requires jube
.run-benchmarks:
  - |+
    cd $BENNCH_DIR/benchmarks
    # TODO: This builds the simulator for each model, one should only call Jube once here and combine the benchmarks for all models
    for benchmark in cb_*${MACHINE}.yml ; do
      jube-autorun -p "20" -r "--hide-animation -e --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE" $benchmark & pid=$!
      PID_LIST+=" $pid";
      # jube run -e --hide-animation --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE $benchmark
      # jube-autorun -p "60" -r "--hide-animation -e --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE" $benchmark
    done
  - 'wait $PID_LIST'
  - 'cat $RESULTS_DIR/000000/000000_build/work/stdout'

# Requires git, git-annex
.results:
  analysis:
    - 'cd $BENNCH_DIR/results'
    - 'mkdir -p $BENNCH_DIR/results/$RESULTS_PATH/nodes'
    # TODO: Modify bennch to write the analysis results in desired directory directly, without having to move them afterwards
    - |+
        echo 'scaling_type: "nodes"' > $BENNCH_DIR/config/analysis_config.yaml
        eval echo 'jube_outpath: "$RESULTS_DIR"' >> $BENNCH_DIR/config/analysis_config.yaml
        for benchmark_result_id in $RESULTS_DIR/* ; do  
          python3 $BENNCH_DIR/analysis/analysis.py $(basename $benchmark_result_id)
          # Move symlinks
          for csv_file in *.csv ; do
            ln -rs $(readlink -f $csv_file) $BENNCH_DIR/results/$RESULTS_PATH/nodes/$csv_file
            rm $csv_file
          done
          for tgz_file in *.tgz ; do
            ln -rs $(readlink -f $tgz_file) $BENNCH_DIR/results/$RESULTS_PATH/nodes/$tgz_file
            rm $tgz_file
          done
        done
    - 'cd $BENNCH_DIR/results'
    - 'mkdir -p $BENNCH_DIR/results/$RESULTS_PATH/threads'
    - |+
        echo 'scaling_type: "threads"' > $BENNCH_DIR/config/analysis_config.yaml
        eval echo 'jube_outpath: "$RESULTS_DIR"' >> $BENNCH_DIR/config/analysis_config.yaml
        for benchmark_result_id in $RESULTS_DIR/* ; do
          python3 $BENNCH_DIR/analysis/analysis.py $(basename $benchmark_result_id)
          for csv_file in *.csv ; do
            ln -rs $(readlink -f $csv_file) $BENNCH_DIR/results/$RESULTS_PATH/threads/$csv_file
            rm $csv_file
          done
          for tgz_file in *.tgz ; do
            ln -rs $(readlink -f $tgz_file) $BENNCH_DIR/results/$RESULTS_PATH/threads/$tgz_file
            rm $tgz_file
          done
        done
  upload:
    # Upload benchmark results
    - 'cd $BENNCH_DIR/results/'
    - 'git annex add .'
    - 'git annex sync --content'
    # - 'git annex copy --to=origin --auto'
  flipbook:
    # TODO: Add another stage which can be triggered manually to create flipbooks with additional configuration
    - 'export PYTHONPATH=$BENNCH_DIR:$PYTHONPATH'
    - |+
      cd $BENNCH_DIR/results/nodes
      python3 $BENNCH_DIR/flipbook/flipbook.py nodes
      mv flipbook.slides.html $CI_PROJECT_DIR/${SIMULATOR_BRANCH}-nodes.slides.html
    - |+
      cd $BENNCH_DIR/results/threads
      python3 $BENNCH_DIR/flipbook/flipbook.py threads
      mv flipbook.slides.html $CI_PROJECT_DIR/${SIMULATOR_BRANCH}-threads.slides.html
