variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"
  SCRIPTS_DIR: "$CI_PROJECT_DIR/.gitlab-ci/scripts"
  TEMPLATES_DIR: "$CI_PROJECT_DIR/.gitlab-ci/templates"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true

# Requires git, python3, and pyyaml
.prepare-benchmarks:
  get-uid:
    - |
      export BENCHMARK_UID="$(echo $BENCHMARK_ID | sed -e 's/[^A-Za-z0-9._-]/_/g')-$(date +%d-%m-%y-%H-%M-%S)"
  # Move all artifacts to user data directory
  artifacts:
    - 'if [[ $(realpath "$CI_PROJECT_DIR/config.yml") != $(realpath "$CONFIG_FILE_PATH") ]]; then mv "$CI_PROJECT_DIR/config.yml" "$CONFIG_FILE_PATH"; fi'
  environment-variables:
    - !reference [ .environment-vars ]
    # TODO
    #- |
    #  for var in SIMULATOR_REPO_DIR JUBE_RESULTS_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR MODELS_DIR BENCHMARKS_DIR ; do
    #    eval "$var"='${$var}'
    #  done
    - 'eval BENNCH_DIR="$BENNCH_DIR"'
    - 'eval SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"'
    - 'eval JUBE_RESULTS_DIR="$JUBE_RESULTS_DIR"'
    - 'eval ANALYSIS_DIR="$ANALYSIS_DIR"'
    - 'eval BUILDER_CONFIG_PATH="$BUILDER_CONFIG_PATH"'
    - 'eval BUILDER_MODULES_DIR="$BUILDER_MODULES_DIR"'
    - 'eval BUILDER_PLANFILE_DIR="$BUILDER_PLANFILE_DIR"'
    - 'eval BUILDER_PACKAGE_DIR="$BUILDER_PACKAGE_DIR"'
    - 'eval BUILDER_SOURCE_DIR="$BUILDER_SOURCE_DIR"'
    - 'eval BUILDER_INSTALL_DIR="$BUILDER_INSTALL_DIR"'
    - 'eval BUILDER_BUILD_DIR="$BUILDER_BUILD_DIR"'
    - 'eval BUILDER_LOG_DIR="$BUILDER_LOG_DIR"'
    - 'eval CONFIG_FILE_PATH="$CONFIG_FILE_PATH"'
    - 'eval MODELS_DIR="$MODELS_DIR"'
    - 'eval BENCHMARKS_DIR="$BENCHMARKS_DIR"'
    - 'eval OUTPUT_DIR="$OUTPUT_DIR"'
  create-dirs:
    - 'mkdir -p "$USER_DATA_DIR" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/metrics" "$JUBE_RESULTS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$MODELS_DIR" "$OUTPUT_DIR"'
  clone-repositories:
    - 'build --get --silent simulator $SIMULATOR_BRANCH'
    - 'python3 "$SCRIPTS_DIR/clone_models.py" "$CONFIG_FILE_PATH" "$MODELS_DIR" "$CB_MODELS"'
  environment-init:
    - !reference [ .environment-vars ]
    - 'mkdir -p "$USER_DATA_DIR/user_files"'
    - 'cd "$USER_DATA_DIR/user_files"'
    - !reference [ .environment-init ]
  environment-load:
    - !reference [ .environment-vars ]
    - 'cd "$USER_DATA_DIR/user_files"'
    - !reference [ .environment-load ]
  results: []
    # Set result repository
    # - 'git clone --single-branch --branch="$RESULTS_BRANCH" --depth=1 "$RESULTS_REPO_URL" "$USER_DATA_DIR/results"'
    # - 'cd $USER_DATA_DIR/results'
    # - 'git annex init'
  builder:
    # Prepare Builder .buildrc
    - |
      echo PLANFILE_PATH="$BUILDER_PLANFILE_DIR" > "$BUILDER_CONFIG_PATH"
      echo PACKAGE_CACHE="$BUILDER_PACKAGE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo SOURCE_PATH="$BUILDER_SOURCE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo BUILD_PATH="$BUILDER_BUILD_DIR" >> "$BUILDER_CONFIG_PATH"
      echo TARGET_PATH="$BUILDER_INSTALL_DIR" >> "$BUILDER_CONFIG_PATH"
      echo MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR" >> "$BUILDER_CONFIG_PATH"
      echo LOG_PATH="$BUILDER_LOG_DIR" >> "$BUILDER_CONFIG_PATH"
    # Prepare simulator installation (builder plan)
    - 'mkdir -p "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH"'
    # TODO: Make this generic and not NEST-specific
    - 'cp "$TEMPLATES_DIR/nest-builder-template" "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH/default"'
    - 'cp "$TEMPLATES_DIR/nest-builder-module" "$BUILDER_PLANFILE_DIR/simulator/$SIMULATOR_BRANCH/default.module"'
  build-simulator:
    - 'build -f simulator $SIMULATOR_BRANCH'
  construct-benchmarks:
    - |
      echo 'CURR_PATH=$(pwd)' > "$USER_DATA_DIR/prepare.sh"
      echo 'cd "$USER_DATA_DIR/user_files"' >> "$USER_DATA_DIR/prepare.sh"
      python3 "$SCRIPTS_DIR/construct_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "$CONFIG_FILE_PATH" "$BUILDER_MODULES_DIR" "$SIMULATOR_BRANCH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/metrics" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$USER_DATA_DIR/prepare.sh" "$CI_PROJECT_DIR/pipelines/${MACHINE}.yml" "$MACHINE"
      echo 'cd "$CURR_PATH"' >> "$USER_DATA_DIR/prepare.sh"

# Requires jube
.run-benchmarks:
  # Wait until all other jube benchmarks have been started until the JUBE_BENCHMARK_ID of this subpipeline
  - |
    while [ $(echo */ | wc) -neq $(expr $JUBE_BENCHMARK_ID + 0) ] ; do
      sleep 3
    done
  # Start the benchmarks now
  - 'cp "$TEMPLATES_DIR/job.slurm.in" "${BENCHMARKS_DIR}/jube/job.slurm.in"'
  - 'jube run --hide-animation -e "${BENCHMARKS_DIR}/jube/cb_${JUBE_BENCHMARK_FILE}_${MACHINE}.yml"'
  - |
    COUNTER=0
    NUM_FAILURES=-1
    declare -A retries
    for run in "$USER_DATA_DIR/jube_results/$JUBE_BENCHMARK_ID"/*/ ; do
        retries[$(basename $run)]=0
    done
    while jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" || [[ $NO_FAILURES -ne 0 ]] ; do
      sleep 30
      jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR" > /dev/null
      COUNTER=$((COUNTER + 1))
      if ! jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; then
        COUNTER=9
      fi
      if [ $COUNTER -eq 9 ] ; then
        sleep 3
        COUNTER=0
        NUM_FAILURES=0
        jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR"
        for run in "$USER_DATA_DIR/jube_results/$JUBE_BENCHMARK_ID"/*/ ; do
          if [ -f "$run/work/stdout" ] ; then
            JOBID=$(grep -e 'Submitted batch job ' -e 'JobId: ' "$run/work/stdout" | head -1 | grep -oP '\d*')
            if grep -q -E 'terminated due to failure of node|Force Terminated StepId' "$run/work/stderr" ; then
              if [[ ${retries[$(basename $run)]} -lt 4 ]] ; then
                (( ++retries[$(basename $run)] ))
                rm -f "$run/work/ready" "$run/work/stderr" "$run/work/stdout"
                cd "$run/work/"
                sbatch job.slurm
                echo "Detected node failure, rerunning job (#${retries[$(basename $run)]})"
                (( ++NUM_FAILURES ))
              fi
            elif ! squeue -h --job $JOBID >/dev/null 2>&1 || [ $(squeue -h --job $JOBID | wc -l) = 0 ] ; then
              touch "$run/work/ready"
            fi
          fi
        done
      fi
    done
  - 'jube info --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
  - 'jube result --analyse --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
  - 'cp "$USER_DATA_DIR/jube_results/$JUBE_BENCHMARK_ID/result/result_table.dat" "$OUTPUT_DIR/${JUBE_BENCHMARK_FILE}_${MACHINE}.csv"'

.variables-as-artifacts:
  - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
  - |
    for var in BENCHMARK_ID BENCHMARK_UID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR BENCHMARKS_DIR SIMULATOR_REPO SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH OUTPUT_DIR NEST_VERSION ; do
      eval val=\$$var
      echo "${var}=${val}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
    done

# TODO: Collect metadata about the pipeline (config, etc.) and upload via git-annex
.results:
  metadata:
    # - cd ${model_path}
    # - model_git_commit_hash=$(git rev-parse HEAD)
    # - cd -
    # - 'gathermetadata ${USER_DATA_DIR}/metadata'
    - 'export RESULTS_UID=$(uuidgen)'
    - 'python "${SCRIPTS_DIR}/_gathermetadata.py" "${USER_DATA_DIR}/${RESULTS_UID}"'
    - 'cp "${CONFIG_FILE_PATH}" "${USER_DATA_DIR}/${RESULTS_UID}/config.yml"'
    # Actual benchmark data
    - 'cp "$OUTPUT_DIR/*" ${USER_DATA_DIR}/${RESULTS_UID}/'
    - 'tar -czf ${USER_DATA_DIR}/${RESULTS_UID}.tgz -C ${USER_DATA_DIR} ${RESULTS_UID}'

  upload:
    # TODO: Move the following two lines to config file as soon as a consistent environment exsists on JSC systems
    - 'module use /p/usersoftware/djinb33/modules/linux-rocky8-x86_64/gcc/11.3.0/'
    - 'module load git-annex'
  
    # Upload benchmark results
    - 'cp "${USER_DATA_DIR}/${RESULTS_UID}.tgz" "$RESULTS_REPO_DIR/${RESULTS_UID}.tgz"'
    - 'cd "$RESULTS_REPO_DIR"'
    - 'git config user.email ""'
    - 'git config user.name "${USER}"'
    - 'git annex add ${RESULTS_UID}.tgz"'
    - 'git annex metadata ${RESULTS_UID}.tgz" --set user=$USER'
    - 'git commit -m "Adding benchmark data for ${BENCHMARK_ID}"'
    # - 'git annex sync --no-pull --content-of=${BENCHMARK_UID}.tgz --jobs=cpus'

  # Requires python3, pyyaml, jupyter, nbconvert, git, and git-annex
  flipbook:
    # TODO: Add another stage which can be triggered manually to create flipbooks with additional configuration
    - 'mkdir "$CI_PROJECT_DIR/flipbooks"'
    - 'python3 "${SCRIPTS_DIR}/create_flipbooks.py" "$JUBE_RESULTS_DIR" "$CI_PROJECT_DIR/flipbooks" "$BENCHMARK_ID"'
