variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true
  when: manual
  rules:
    - if: $CB_MACHINES =~ $MACHINE  # Only make benchmark for machine runnable if configuration was provided for it

# Requires git, python3 and pyyaml
.prepare-benchmarks:
  # Move all artifacts to user data directory
  artifacts:
    - |+
      mv $CI_PROJECT_DIR/repository $USER_DATA_DIR/repository
      mv $CI_PROJECT_DIR/config_repository $USER_DATA_DIR/config_repository
      mv $CI_PROJECT_DIR/model_repos $USER_DATA_DIR/model_repos
  environment-variables:
    - 'eval USER_DATA_DIR=$TEMP_DIR/$USER/$(date +%s)'
    - 'eval WORKSPACE_DIR=$WORKSPACE_DIR'
    - 'eval BENNCH_DIR=$BENNCH_DIR'
    - 'eval USER_DATA_DIR=$USER_DATA_DIR'
    - 'eval SIMULATOR_REPO_DIR=$SIMULATOR_REPO_DIR'
    - 'eval RESULTS_DIR=$RESULTS_DIR'
    - 'eval BUILDER_DIR=$BUILDER_DIR'
    - 'eval BUILDER_MODULES_DIR=$BUILDER_MODULES_DIR'
    - 'eval BUILDER_PLANFILE_DIR=$BUILDER_PLANFILE_DIR'
    - 'eval BUILDER_PACKAGE_DIR=$BUILDER_PACKAGE_DIR'
    - 'eval BUILDER_SOURCE_DIR=$BUILDER_SOURCE_DIR'
    - 'eval BUILDER_INSTALL_DIR=$BUILDER_INSTALL_DIR'
    - 'eval BUILDER_BUILD_DIR=$BUILDER_BUILD_DIR'
    - 'eval BUILDER_LOG_DIR=$BUILDER_LOG_DIR'
    - 'eval GIT_ANNEX_DIR=$GIT_ANNEX_DIR'
  create-dirs:
    - 'mkdir -p $USER_DATA_DIR $WORKSPACE_DIR $SIMULATOR_REPO_DIR $BENNCH_DIR $BUILDER_DIR $BUILDER_MODULES_DIR $BUILDER_PLANFILE_DIR $BUILDER_PACKAGE_DIR $BUILDER_SOURCE_DIR $BUILDER_INSTALL_DIR $BUILDER_BUILD_DIR $BUILDER_LOG_DIR $GIT_ANNEX_DIR'
  apt-requirements:
    - |+
      REQUIREMENTS=$(python3 $CI_PROJECT_DIR/.gitlab-ci/scripts/get_requirements_from_config.py apt ${USER_DATA_DIR}/config_repository/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        apt-get install -y $REQUIREMENTS
      fi
  pip-requirements:
    - |+
      REQUIREMENTS=$(python3 $CI_PROJECT_DIR/.gitlab-ci/scripts/get_requirements_from_config.py pip ${USER_DATA_DIR}/config_repository/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        pip3 install --user $REQUIREMENTS
      fi
  modules-requirements:
    - |+
      REQUIREMENTS=$(python3 $CI_PROJECT_DIR/.gitlab-ci/scripts/get_requirements_from_config.py modules ${USER_DATA_DIR}/config_repository/$CONFIG_PATH $MACHINE)
      if [ ! -z "$REQUIREMENTS" ] ; then
        module load $REQUIREMENTS
      fi'
  configs:
    - |+
      'rm -rf $BENNCH_DIR/config/* $BENNCH_DIR/benchmarks/*'
    - 'python3 $CI_PROJECT_DIR/.gitlab-ci/scripts/patch_configs.py $USER_DATA_DIR/config_repository/$CONFIG_PATH $BENNCH_DIR/benchmarks $BENNCH_DIR/config/$MACHINE $BUILDER_MODULES_DIR $BENNCH_DIR $USER_DATA_DIR/model_repos $MACHINE'
  results:
    # Set result repository
    - 'cd $BENNCH_DIR'
    - 'ls'
    - 'git submodule set-url -- results $RESULTS_REPO_URL'
    - 'git submodule set-branch --branch=$RESULTS_BRANCH -- results'
    - 'cat .gitmodules'
    - 'git submodule update --depth=1 --init --recursive --remote -- results'
  analysis:
    - 'cd $BENNCH_DIR'
    - 'git submodule update --depth=1 --init --recursive --remote -- plot'


# Requires jube
.run-benchmarks:
  - 'cd $BENNCH_DIR/benchmarks'
  - |+
      # TODO: This builds the simulator for each model, one should only call Jube once here and combine the benchmarks for all models
      for benchmark in cb_*${MACHINE}.yml; do
        # jube-autorun -r "--hide-animation -e --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE" $benchmark & pid=$!
        # PID_LIST+=" $pid";
        # jube run -e --hide-animation --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE $benchmark
        jube-autorun -p "120" -r "--hide-animation -e --outpath=$RESULTS_DIR --include-path=$BENNCH_DIR/config/$MACHINE" $benchmark
      done
      cat $RESULTS_DIR/000000/000000_build/work/stdout
      cat $RESULTS_DIR/000000/000000_build/work/stderr
      cat $RESULTS_DIR/000000/000001_bench/work/stdout
      cat $RESULTS_DIR/000000/000001_bench/work/stderr
      scontrol show job 1
      # wait $PID_LIST
  # Move results to directory
  - 'cat jube_job_output.txt'

# Requires git, git-annex
.results:
  analysis:
    # Perform analysis on all benchmark results
    - 'cd $BENNCH_DIR/results'
    - |+
        for benchmark_result_id in 0*/ ; do
          echo 'scaling_type: "nodes"\njube_outpath: "$RESULTS_DIR"' > config/analysis_config.yaml
          python ../analysis/analysis.py benchmark_result_id
          echo 'scaling_type: "threads"\njube_outpath: "$RESULTS_DIR"' > config/analysis_config.yaml
          python ../analysis/analysis.py benchmark_result_id
        done
  upload:
    - 'git annex sync'
