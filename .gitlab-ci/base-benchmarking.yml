variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository/"
  CI_DIR: "$CI_PROJECT_DIR/.gitlab-ci"
  SCRIPTS_DIR: "$CI_DIR/scripts"
  TEMPLATES_DIR: "$CI_DIR/templates"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true

.machine-selection:
  when: manual
  rules:
    # Only make benchmark for machine runnable if configuration was provided for it
    - if: $CB_MACHINES =~ $CB_MACHINE

# Requires git, python3, and pyyaml
.prepare-benchmarks:
  # Move all artifacts to user data directory
  artifacts:
    - |+
      mv "$CI_PROJECT_DIR/repository/"* "$SIMULATOR_REPO_DIR"
      mv "$CI_PROJECT_DIR/config_repository/"* "$CONFIG_DIR"
      mv "$CI_PROJECT_DIR/model_repos/"* "$MODELS_DIR"
  environment-variables:
    - 'eval USER_DATA_DIR="$TEMP_DIR/$USER/${BENCHMARK_ID}-$(date +%d-%m-%y-%H-%M-%S)"'
    - 'eval WORKSPACE_DIR="$WORKSPACE_DIR"'
    - 'eval BENNCH_DIR="$BENNCH_DIR"'
    - 'eval USER_DATA_DIR="$USER_DATA_DIR"'
    - 'eval SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"'
    - 'eval JUBE_RESULTS_DIR="$JUBE_RESULTS_DIR"'
    - 'eval ANALYSIS_DIR="$ANALYSIS_DIR"'
    - 'eval BUILDER_DIR="$BUILDER_DIR"'
    - 'eval BUILDER_MODULES_DIR="$BUILDER_MODULES_DIR"'
    - 'eval BUILDER_PLANFILE_DIR="$BUILDER_PLANFILE_DIR"'
    - 'eval BUILDER_PACKAGE_DIR="$BUILDER_PACKAGE_DIR"'
    - 'eval BUILDER_SOURCE_DIR="$BUILDER_SOURCE_DIR"'
    - 'eval BUILDER_INSTALL_DIR="$BUILDER_INSTALL_DIR"'
    - 'eval BUILDER_BUILD_DIR="$BUILDER_BUILD_DIR"'
    - 'eval BUILDER_LOG_DIR="$BUILDER_LOG_DIR"'
    - 'eval GIT_ANNEX_DIR="$GIT_ANNEX_DIR"'
    - 'eval CONFIG_DIR="$CONFIG_DIR"'
    - 'eval MODELS_DIR="$MODELS_DIR"'
    - 'eval BENNCHPLOT_DIR="$BENNCHPLOT_DIR"'
    - 'eval BENCHMARKS_DIR="$BENCHMARKS_DIR"'
  create-dirs:
    - 'mkdir -p "$USER_DATA_DIR" "$WORKSPACE_DIR" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/configs/$MACHINE" "$JUBE_RESULTS_DIR" "$ANALYSIS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$CONFIG_DIR" "$MODELS_DIR"'
  apt-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" apt "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        apt-get install -y $REQUIREMENTS
      fi
  pip-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" pip "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        pip3 install $REQUIREMENTS
      fi
  modules-requirements:
    - |+
      REQUIREMENTS=$(python3 "$SCRIPTS_DIR/get_requirements_from_config.py" modules "${CONFIG_DIR}/$CONFIG_PATH" "$MACHINE")
      if [ ! -z "$REQUIREMENTS" ] ; then
        module load $REQUIREMENTS
      fi
  configs:
    - 'python3 "$SCRIPTS_DIR/patch_configs.py" "${CONFIG_DIR}/$CONFIG_PATH" "$BENCHMARKS_DIR/configs/$MACHINE" "$BUILDER_MODULES_DIR" "$SIMULATOR_BRANCH" "$MACHINE"'
  results:
    # Set result repository
    - 'git clone --single-branch --branch="$RESULTS_BRANCH" --depth=1 "$RESULTS_REPO_URL" "$USER_DATA_DIR/results"'
    - 'cd $USER_DATA_DIR/results'
    - 'git annex init'
  build-simulator:
    # TODO: Make this generic to not only work for NEST
    - 'build -f nest-simulator $SIMULATOR_BRANCH'
  build-benchmarks:
    - 'python3 "$SCRIPTS_DIR/build_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "${CONFIG_DIR}/$CONFIG_PATH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/configs/$MACHINE" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$MACHINE"'

# Requires jube
.run-benchmarks:
  - 'cp "$TEMPLATES_DIR/job.slurm.in" "$BENCHMARKS_DIR/jube/job.slurm.in"'
  - |+
    for benchmark in "$BENCHMARKS_DIR/jube/cb_"*"${MACHINE}.yml" ; do
      jube run --hide-animation -e --include-path="$BENNCH_DIR/config/$MACHINE" $benchmark
    done
  - |+
    shopt
    while jube status --id=all "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; do
      sleep 5 || echo "sleep $?"
      jube continue --error --id=all --hide-animation "$JUBE_RESULTS_DIR" || echo "continue $?"
      jube status --id=all "$JUBE_RESULTS_DIR" || echo "jube $?"
      jube status --id=all "$JUBE_RESULTS_DIR" | grep -q "RUNNING" || echo "status $?"
    done
    echo done
  - 'jube analyse --id=all "$JUBE_RESULTS_DIR"'

