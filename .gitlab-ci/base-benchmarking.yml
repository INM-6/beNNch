# Requires python3, pyyaml, jupyter, nbconvert, git, and git-annex
.results:
  analysis:
    - 'mkdir -p "$ANALYSIS_DIR/nodes" "$ANALYSIS_DIR/threads"'
    - 'export PYTHONPATH="$BENNCH_DIR:$PYTHONPATH"'
    # TODO: Modify bennch to write the analysis results in desired directory directly, without having to move them afterwards
    - |+
        for benchmark_result_id in "$JUBE_RESULTS_DIR"/* ; do
          python3 "$BENNCH_DIR/analysis/analyse.py" "$JUBE_RESULTS_DIR" $(basename $benchmark_result_id) nodes "$ANALYSIS_DIR/nodes"
          python3 "$BENNCH_DIR/analysis/analyse.py" "$JUBE_RESULTS_DIR" $(basename $benchmark_result_id) threads "$ANALYSIS_DIR/threads"
        done
  upload:
    # TODO: Collect metadata about the pipeline (config, etc.)
    # TODO: Upload benchmark results
    - 'cd "$ANALYSIS_DIR"'
    # - 'git annex add .'
    # - 'git annex sync --content'
    # - 'git annex copy --to=origin --auto'
  flipbook:
    # TODO: Add another stage which can be triggered manually to create flipbooks with additional configuration
    - 'export PYTHONPATH="$BENNCH_DIR:$PYTHONPATH"'
    - |+
      cd "$ANALYSIS_DIR/nodes"
      python3 "$BENNCH_DIR/flipbook/flipbook.py" nodes
      mv flipbook.slides.html "$CI_PROJECT_DIR/${BENCHMARK_ID}-nodes.slides.html"
    - |+
      cd "$ANALYSIS_DIR/threads"
      python3 "$BENNCH_DIR/flipbook/flipbook.py" threads
      mv flipbook.slides.html "$CI_PROJECT_DIR/${BENCHMARK_ID}-threads.slides.html"

  # TODO: Add another job at the end which collects the artifacts of all downstream pipelines and combines them into a single archive
