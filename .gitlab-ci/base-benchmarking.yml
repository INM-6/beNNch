variables:
  SIMULATOR_REPO_DIR: "$$USER_DATA_DIR/repository"
  RESULTS_DIR: "$$USER_DATA_DIR/results"
  SCRIPTS_DIR: "$CI_PROJECT_DIR/.gitlab-ci/scripts"
  TEMPLATES_DIR: "$CI_PROJECT_DIR/.gitlab-ci/templates"
  JUBE_RESULTS_DIR: "$$USER_DATA_DIR/jube_results"
  BENCHMARKS_DIR: "$$USER_DATA_DIR/benchmarks"
  CONFIG_FILE_PATH: "$$USER_DATA_DIR/config.yml"
  MODELS_DIR: "$$USER_DATA_DIR/models"
  OUTPUT_DIR: "$$USER_DATA_DIR/benchmark_results"
  MACHINE: "$CB_MACHINE"

.base-benchmarking:
  allow_failure: false
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: "Validate Input"
      artifacts: true

# Requires git, python3, and pyyaml
# Run once per machine for all models
.prepare-benchmarks:
  get-uid:
    - |
      export BENCHMARK_UID="$(echo $BENCHMARK_ID | sed -e 's/[^A-Za-z0-9._-]/_/g')-$(date +%Y-%m-%d-%H-%M-%S)"
  # Move all artifacts to user data directory
  artifacts:
    - 'if [[ $(realpath "$CI_PROJECT_DIR/config.yml") != $(realpath "$CONFIG_FILE_PATH") ]]; then mv "$CI_PROJECT_DIR/config.yml" "$CONFIG_FILE_PATH"; fi'
    - 'if [[ $(realpath "$CI_PROJECT_DIR/simulator.module") != $(realpath "$SIMULATOR_MODULEFILE_PATH") ]]; then mv "$CI_PROJECT_DIR/simulator.module" "$SIMULATOR_MODULEFILE_PATH"; fi'
    - 'if [[ $(realpath "$CI_PROJECT_DIR/simulator.planfile") != $(realpath "$SIMULATOR_PLANFILE_PATH") ]]; then mv "$CI_PROJECT_DIR/simulator.planfile" "$SIMULATOR_PLANFILE_PATH"; fi'
  environment-variables:
    - !reference [ .environment-vars ]
    # TODO
    #- |
    #  for var in SIMULATOR_REPO_DIR JUBE_RESULTS_DIR BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR MODELS_DIR BENCHMARKS_DIR ; do
    #    eval "$var"='${$var}'
    #  done
    - 'eval BENNCH_DIR="$BENNCH_DIR"'
    - 'eval SIMULATOR_REPO_DIR="$SIMULATOR_REPO_DIR"'
    - 'eval RESULTS_DIR="$RESULTS_DIR"'
    - 'eval JUBE_RESULTS_DIR="$JUBE_RESULTS_DIR"'
    - 'eval ANALYSIS_DIR="$ANALYSIS_DIR"'
    - 'eval BUILDER_CONFIG_PATH="$BUILDER_CONFIG_PATH"'
    - 'eval BUILDER_MODULES_DIR="$BUILDER_MODULES_DIR"'
    - 'eval BUILDER_PLANFILE_DIR="$BUILDER_PLANFILE_DIR"'
    - 'eval BUILDER_PACKAGE_DIR="$BUILDER_PACKAGE_DIR"'
    - 'eval BUILDER_SOURCE_DIR="$BUILDER_SOURCE_DIR"'
    - 'eval BUILDER_INSTALL_DIR="$BUILDER_INSTALL_DIR"'
    - 'eval BUILDER_BUILD_DIR="$BUILDER_BUILD_DIR"'
    - 'eval BUILDER_LOG_DIR="$BUILDER_LOG_DIR"'
    - 'eval CONFIG_FILE_PATH="$CONFIG_FILE_PATH"'
    - 'eval SIMULATOR_MODULEFILE_PATH="$SIMULATOR_MODULEFILE_PATH"'
    - 'eval SIMULATOR_PLANFILE_PATH="$SIMULATOR_PLANFILE_PATH"'
    - 'eval MODELS_DIR="$MODELS_DIR"'
    - 'eval BENCHMARKS_DIR="$BENCHMARKS_DIR"'
    - 'eval OUTPUT_DIR="$OUTPUT_DIR"'
    - 'eval RESULTS_REPO_URL="$RESULTS_REPO_URL"'
    - 'eval RESULTS_BRANCH="$RESULTS_BRANCH"'
    # - 'eval RESULTS_REPO_TOKEN="$RESULTS_REPO_TOKEN"'
    - 'cd "${SIMULATOR_REPO_DIR}"'
    - 'export simulator_git_commit_hash=$(git rev-parse HEAD)'

  create-dirs:
    - 'mkdir -p "$USER_DATA_DIR" "$SIMULATOR_REPO_DIR" "$BENCHMARKS_DIR/metrics" "$JUBE_RESULTS_DIR" "$RESULTS_DIR" "$BENCHMARKS_DIR/jube" "$BUILDER_MODULES_DIR" "$BUILDER_PLANFILE_DIR/simulator" "$BUILDER_PACKAGE_DIR" "$BUILDER_SOURCE_DIR" "$BUILDER_INSTALL_DIR" "$BUILDER_BUILD_DIR" "$BUILDER_LOG_DIR" "$MODELS_DIR" "$OUTPUT_DIR"  "$CI_PROJECT_DIR/flipbooks"'
  environment-init:
    - !reference [ .environment-vars ]
    - 'mkdir -p "$USER_DATA_DIR/user_files"'
    - 'cd "$USER_DATA_DIR/user_files"'
    - !reference [ .environment-init ]
  environment-load:
    - !reference [ .environment-vars ]
    - 'cd "$USER_DATA_DIR/user_files"'
    - !reference [ .environment-load ]
  results:
    # Set result repository
    # The additional empty value for credential.helper causes any existing credential helpers to be removed, preventing the addition of this token into the user's credential helper. If you'd like the user to be able to save it, then remove that directive. See https://stackoverflow.com/questions/70960407/keep-git-auth-as-environment-variable-instead-of-evaluated-value
    # - |
    #   git clone -c credential.helper='!f() { echo "username=$RESULTS_REPO_TOKEN"; echo "password="; };f' --single-branch --branch="$RESULTS_BRANCH" --depth=1 "$RESULTS_REPO_URL" "$RESULTS_DIR"
    - 'git clone --single-branch --branch="$RESULTS_BRANCH" "$RESULTS_REPO_URL" "$RESULTS_DIR"'
    - 'cd "$RESULTS_DIR"'
    # - 'git config --local --unset credential.helper'
    - 'git annex init'
    # - 'git annex enableremote oursharedremote'  # TODO: Make this part of a config as well
  clone-repositories:
    - |
      export CB_SIMULATOR_BRANCH=$(python3 -c "import yaml; f = open('$CONFIG_FILE_PATH', 'r'); print(yaml.safe_load(f)['software_parameters']['simulator_repo_branch']);f.close()")
    - 'python3 "$SCRIPTS_DIR/clone_models.py" "$CONFIG_FILE_PATH" "$MODELS_DIR" "$CB_MODELS"'
    # Prepare Builder .buildrc
    - |
      echo PLANFILE_PATH="$BUILDER_PLANFILE_DIR" > "$BUILDER_CONFIG_PATH"
      echo PACKAGE_CACHE="$BUILDER_PACKAGE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo SOURCE_PATH="$BUILDER_SOURCE_DIR" >> "$BUILDER_CONFIG_PATH"
      echo BUILD_PATH="$BUILDER_BUILD_DIR" >> "$BUILDER_CONFIG_PATH"
      echo TARGET_PATH="$BUILDER_INSTALL_DIR" >> "$BUILDER_CONFIG_PATH"
      echo MODULE_INSTALL_PATH="$BUILDER_MODULES_DIR" >> "$BUILDER_CONFIG_PATH"
      echo LOG_PATH="$BUILDER_LOG_DIR" >> "$BUILDER_CONFIG_PATH"
    # Prepare simulator installation (builder plan and module)
    - 'mkdir -p "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH"'
    - 'cp "$SIMULATOR_PLANFILE_PATH" "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH/default"'
    - 'cp "$SIMULATOR_MODULEFILE_PATH" "$BUILDER_PLANFILE_DIR/simulator/$CB_SIMULATOR_BRANCH/default.module"'
  build-simulator:
    - 'build -f simulator $CB_SIMULATOR_BRANCH'
    - 'rm -r "$SIMULATOR_REPO_DIR"'
  construct-benchmarks:
    - |
      echo 'CURR_PATH=$(pwd)' > "$USER_DATA_DIR/prepare.sh"
      echo 'cd "$USER_DATA_DIR/user_files"' >> "$USER_DATA_DIR/prepare.sh"
      python3 "$SCRIPTS_DIR/construct_benchmarks.py" "$TEMPLATES_DIR/jube-template.yml" "$CONFIG_FILE_PATH" "$BUILDER_MODULES_DIR" "$CB_SIMULATOR_BRANCH" "$MODELS_DIR" "$BENCHMARKS_DIR/jube" "$BENCHMARKS_DIR/metrics" "$SCRIPTS_DIR" "$JUBE_RESULTS_DIR" "$USER_DATA_DIR/prepare.sh" "$CI_PROJECT_DIR/pipelines/${MACHINE}.yml" "$MACHINE"
      echo 'cd "$CURR_PATH"' >> "$USER_DATA_DIR/prepare.sh"

# Requires jube, python3
# Run once per model-machine combination
.run-benchmarks:
  # Log quota before and after run
  - 'jutil user cpuquota -u $USER -A ${CB_RUNNER_ACCOUNT} --currsys'
  # Wait until all other jube benchmarks have been started until the JUBE_BENCHMARK_ID of this subpipeline
  - 'cd $JUBE_RESULTS_DIR'
  # Wait until it's my turn to create a workpackage directory (i.e., call jube run)
  - |
    while [ $( find . -mindepth 1 -maxdepth 1 -type d | wc -l) -ne $(expr $JUBE_BENCHMARK_ID + 0) ] ; do
      sleep 3
    done
  # Start the benchmarks now
  - 'cp "$TEMPLATES_DIR/job.slurm.in" "${BENCHMARKS_DIR}/jube/job.slurm.in"'
  # If our workpackage directory exists already, we don't call jube run again, as we only need to continue (can only happen if the workflow-job was rerun by the user)
  - |
    if [ $( find . -mindepth 1 -maxdepth 1 -type d | wc -l) -ge $(expr $JUBE_BENCHMARK_ID - 1) ] ; then
      jube run --hide-animation -e "${BENCHMARKS_DIR}/jube/cb_${JUBE_BENCHMARK_FILE}_${MACHINE}.yml"
    fi
  - |
    COUNTER=0
    NUM_FAILURES=-1
    declare -A retries
    for run in "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID"/*/ ; do
        retries[$(basename $run)]=0
    done
    while jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" || [[ $NO_FAILURES -ne 0 ]] ; do
      sleep 30
      jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR" > /dev/null
      COUNTER=$((COUNTER + 1))
      if ! jube status --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR" | grep -q "RUNNING" ; then
        COUNTER=9
      fi
      if [ $COUNTER -eq 9 ] ; then
        sleep 3
        COUNTER=0
        NUM_FAILURES=0
        jube continue --error --id=$JUBE_BENCHMARK_ID --hide-animation "$JUBE_RESULTS_DIR"
        for run in "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID"/*/ ; do
          if [ -f "$run/work/stdout" ] ; then
            JOBID=$(grep -e 'Submitted batch job ' -e 'JobId: ' "$run/work/stdout" | head -1 | grep -oP '\d*')
            if grep -q -E 'terminated due to failure of node|Force Terminated StepId' "$run/work/stderr" ; then
              if [[ ${retries[$(basename $run)]} -lt 4 ]] ; then
                (( ++retries[$(basename $run)] ))
                rm -f "$run/work/ready" "$run/work/stderr" "$run/work/stdout"
                cd "$run/work/"
                sbatch job.slurm
                echo "Detected node failure, rerunning job (#${retries[$(basename $run)]})"
                (( ++NUM_FAILURES ))
              else
                touch "$run/work/error"
              fi
            elif ! squeue -h --job $JOBID >/dev/null 2>&1 || [ $(squeue -h --job $JOBID | wc -l) = 0 ] ; then
              touch "$run/work/ready"
            fi
          fi
        done
      fi
    done
  - 'jube info --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
  - 'jube result --analyse --id=$JUBE_BENCHMARK_ID "$JUBE_RESULTS_DIR"'
  # Log quota before and after run
  - 'jutil user cpuquota -u $USER -A ${CB_RUNNER_ACCOUNT} --currsys'

# Requires python3, gathermetadata
# Run once per model-machine combination
.collect-metadata:
  - 'export RESULTS_UID=$(uuidgen)'
  - 'mkdir -p "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/"'
  - 'cp "${CONFIG_FILE_PATH}" "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/config.yml"'
  # Add actual benchmark data
  - 'cp "$JUBE_RESULTS_DIR/$JUBE_BENCHMARK_ID/result/result_table.dat" "$OUTPUT_DIR/${JUBE_BENCHMARK_FILE}_${MACHINE}/benchmark_results.csv"'
  - 'tar -czf "${RESULTS_DIR}/${RESULTS_PATH}/${RESULTS_UID}.tgz" -C "${OUTPUT_DIR}" "${JUBE_BENCHMARK_FILE}_${MACHINE}"'
  # Add metadata to output archive
  - 'cd ${MODELS_DIR}/${JUBE_BENCHMARK_FILE}'
  - 'export model_git_commit_hash=$(git rev-parse HEAD)'
  # - 'cd "$RESULTS_DIR/$RESULTS_PATH/"'
  - 'cd "$RESULTS_DIR/$RESULTS_PATH"'
  - 'git annex add "${RESULTS_UID}.tgz"'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set user=$USER'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set machine=$MACHINE'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set key=$RESULTS_UID'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set model_name=$JUBE_BENCHMARK_FILE'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set model_git_commit_hash="$model_git_commit_hash"'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set simulator_version=$CB_SIMULATOR_BRANCH'
  - 'git annex metadata "${RESULTS_UID}.tgz" --set simulator_git_commit_hash="$simulator_git_commit_hash"'
  # Add metadata coming from lscpu and from user config
  - 'python ${SCRIPTS_DIR}/add_metadata.py "${RESULTS_UID}.tgz" "${JUBE_RESULTS_DIR}/000000/000000_bench/work/cpu.json" "$CONFIG_FILE_PATH" "$MACHINE" "$JUBE_BENCHMARK_FILE"'

# Requires python3, pyyaml, jupyter, nbconvert, git, and git-annex
# Run once per model-machine combination
.flipbook:
  # TODO: Add another stage which can be triggered manually to create flipbooks or other plots with additional configuration
  - 'mkdir -p "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/flipbooks"'
  - 'python3 "${SCRIPTS_DIR}/create_flipbooks.py" "$JUBE_RESULTS_DIR" "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/flipbooks" "$BENCHMARK_ID"'
  - 'cp -r "${OUTPUT_DIR}/${JUBE_BENCHMARK_FILE}_${MACHINE}/flipbooks" "$CI_PROJECT_DIR/flipbooks"'

# Requires git, python3, pyyaml, bennchplot
# Run once per machine for all models
.upload-results:
  - 'cd "$RESULTS_DIR/$RESULTS_PATH"'
  # - |
  #   git config --local credential.helper '!f() { echo "username=$RESULTS_REPO_TOKEN"; echo "password="; };f'
  - 'git config --local user.name "${USER}"'
  # Push data to remote repository
  - 'git commit -m "Adding benchmark data for ${BENCHMARK_ID}"'
  # - 'git push origin $RESULTS_BRANCH'
  # - 'git annex copy --to=oursharedremote'
  # - 'git annex dead $(git config annex.uuid)'
  # - 'git annex forget --drop-dead --force'
  # - 'git annex sync'

.variables-as-artifacts:
  - 'rm -f "$CI_PROJECT_DIR/benchmark_variables.env"'
  - |
    for var in BENCHMARK_ID BENCHMARK_UID CB_RUNNER_ACCOUNT CB_COMPUTE_PROJECT CB_DATA_PROJECT CB_DEPENDENCIES USER_DATA_DIR BENCHMARKS_DIR CB_SIMULATOR_REPO CB_SIMULATOR_BRANCH SIMULATOR_REPO_DIR JUBE_RESULTS_DIR RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH BUILDER_MODULES_DIR BUILDER_PLANFILE_DIR BUILDER_PACKAGE_DIR BUILDER_SOURCE_DIR BUILDER_INSTALL_DIR BUILDER_BUILD_DIR BUILDER_LOG_DIR CONFIG_FILE_PATH MODELS_DIR BUILDER_CONFIG_PATH OUTPUT_DIR RESULTS_DIR simulator_git_commit_hash ; do
    # RESULTS_REPO_TOKEN
      eval val=\$$var
      echo "${var}=${val}" >> "$CI_PROJECT_DIR/benchmark_variables.env"
    done
