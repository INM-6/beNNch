.front:
  before_script:
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - '. /mnt/proj3/dd-24-83/ebrains-spack-builds-external-MPI-only/activate_env.sh'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'source benchmarking-env/bin/activate'
    - 'export PATH="$(pwd):$PATH"'
  timeout: "2 hours 15 minutes"
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES --deadline=now+2hours"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:10:00
    CB_JOB_MEM: "16G"
  tags:
    - shell
    - karolina
    - jacamar

.compute:
  before_script:
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - '. /mnt/proj3/dd-24-83/ebrains-spack-builds-external-MPI-only/activate_env.sh'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'source benchmarking-env/bin/activate'
    - 'export PATH="$(pwd):$PATH"'
  timeout: "2 days 30 minutes"
  variables:
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --mem=$CB_JOB_MEM --nodes=$CB_NUMNODES --deadline=now+2days"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:10:00
    CB_JOB_MEM: "16G"
  tags:
    - compute
    - karolina
    - jacamar

variables:
    TEMP_DIR: ""
    extra_sbatch_flags: "--disable-perfparanoid"
    extra_srun_flags: "--cpu-bind=mask_cpu:$CPU_BIND_MASK" 
    CUSTOM_CI_BUILDS_DIR: ""
