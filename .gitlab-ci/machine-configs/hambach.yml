.front:
  before_script:
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - |
      python -m venv --system-site-packages benchmarking-env
      source benchmarking-env/bin/activate
      if [[ -n "$PIP_LIST" ]]; then
        benchmarking-env/bin/pip download $PIP_LIST --dest ./pip-packages
        benchmarking-env/bin/pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
      if [ -d "${CI_PROJECT_DIR}/gather-metadata" ]; then
        pip install "${CI_PROJECT_DIR}/gather-metadata"
      fi
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:10:00
    CB_RUNNER_ACCOUNT: hambach
    CB_JOB_MEM: "8G"
  tags:
    - hambach

.compute:
  before_script:
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - |
      python -m venv --system-site-packages benchmarking-env
      source benchmarking-env/bin/activate
      if [[ -n "$PIP_LIST" ]]; then
        pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
      if [ -d "${CI_PROJECT_DIR}/gather-metadata" ]; then
        pip install "${CI_PROJECT_DIR}/gather-metadata"
      fi

    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'

  #
  # Jobstep base definition for running inside a Slurm job (e.g. by Jacamar).
  #
  # Set "variable:CB_JOB_TIME" in derived jobs to specify the maximum compute
  # quota usage of the jobstep.
  #
  # NOTE: The `timeout` specifies how long Gitlab waits before considering the
  # job dead. This includes the time jacamar has to wait in the slurm queue.
  # The maximum accounted time for the Slurm job is specified by
  # `CB_JOB_TIME`, which should be defined in each job that extends `.compute-node`.
  # The deadline parameter helps to cancel a job if the queue is longer than
  # the given gitlab `timeout` value and should always point a bit before
  # `timeout` to prevent sheduled jobs to "almost complete" and get aborted
  # from gitlab side.
  #
  #     [-------------- Gitlab job timeout ----------------------]
  #       [--------------- Slurm deadline -------------------]
  #     ▲ [  ~  slurm queue wait  ~  |===CB_JOB_TIME===]        ▲
  #     │                            ▲                       ▲   │
  #     │ ▲                          └ compute job starts    │   │
  #     │ └ gitlab job added to slurm queue            ▲     │   │
  #     └ gitlab pipeline starts job                   │     │   │
  #                               latest slurm job end ┘     │   │
  #           latest projected job end time or not scheduled ┘   │
  #                            Gitlab aborts job if still around ┘
  #
  timeout: "4 hours 15 minutes"
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --cpus-per-task=16 --tasks-per-node=1 --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES --deadline=now+4hours"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: "00:10:00"
    CB_JOB_MEM: "8G" 
  tags:
    - hambach

variables:
  TEMP_DIR: "/work/users"
  extra_srun_flags: "--mpi=pmix"
  extra_sbatch_flags: ""
