.front:
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES --exclusive"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:30:00
    CB_RUNNER_ACCOUNT: hambach
    CB_JOB_MEM: "16G"
  tags:
    - hambach

.compute:
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES --exclusive"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:30:00
    CB_RUNNER_ACCOUNT: hambach
    CB_JOB_MEM: "16G"
  tags:
    - hambach

variables:
  TEMP_DIR: "/work/users"
  extra_srun_flags: "--mpi=pmix"
  extra_sbatch_flags: "--exclusive"

.initialise:
  script:
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - 'module load $MODULE_LIST'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'benchmarking-env/bin/pip install $PIP_LIST'
    - 'ls -al'

.environment-load:
  before_script:
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - 'module load $MODULE_LIST'
    - 'source benchmarking-env/bin/activate'
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
