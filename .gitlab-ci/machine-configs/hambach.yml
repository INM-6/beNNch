include: .gitlab-ci/jacamar-benchmarking.yml

.preparation:
  tags:
    - hambach

.build:
  variables:
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=$CB_BUILD_TIME_LIMIT --nodes=1 --exclusive --reservation=nest"
  tags:
    - hambach

.benchmark:
  tags:
    - hambach

.aggregation:
  tags:
    - hambach

variables:
    extra_slurm_flags: "--mpi=pmix"

.environment-init:
  - 'export PYTHONNOUSERSITE=1'

.environment-load:
  - 'export PYTHONNOUSERSITE=1'
