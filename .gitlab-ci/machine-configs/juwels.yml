.front:
  before_script:
    - 'jutil env activate -p cjinb33'
    - 'jutil env activate -p djinb33'
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'source benchmarking-env/bin/activate'
    - |
      if [[ -n "$PIP_LIST" ]]; then
        benchmarking-env/bin/pip download $PIP_LIST --dest ./pip-packages
        benchmarking-env/bin/pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
  timeout: "2 hours 15 minutes"
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES --deadline=now+2hours"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: "00:10:00"
    CB_JOB_MEM: "16G"
  tags:
    - shell
    - juwels
    - jacamar

.compute:
  before_script:
    - 'jutil env activate -p cjinb33'
    - 'jutil env activate -p djinb33'
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'source benchmarking-env/bin/activate'
    - |
      if [[ -n "$PIP_LIST" ]]; then
        benchmarking-env/bin/pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
  timeout: "2 days 30 minutes"
  variables:
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --mem=$CB_JOB_MEM --nodes=$CB_NUMNODES --deadline=now+2days"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: "00:10:00"
    CB_JOB_MEM: "16G"
  tags:
    - compute
    - juwels
    - jacamar

variables:
    TEMP_DIR: "$$SCRATCH_cjinb33/ci-bennch/juwels/userdata"
    extra_sbatch_flags: "--disable-turbomode --disable-perfparanoid"
    extra_srun_flags: "--cpu-bind=mask_cpu:$CPU_BIND_MASK" 
    CUSTOM_CI_BUILDS_DIR: "/p/scratch/cjinb33/.jacamar-ci/"
