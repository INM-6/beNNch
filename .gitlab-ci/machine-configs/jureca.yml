include: .gitlab-ci/jacamar-benchmarking.yml

variables:
  # TODO: Instead of USERSOFTWARE_djinb33, use a place which can be accessed by anyone independent of account
  TEMP_DIR: "$$SCRATCH/ci-bennch/$WORKSPACE/jureca/userdata"           # Directory to temporary files accessible from both login and compute nodes
  WORKSPACE_DIR: "$$USERSOFTWARE_djinb33/ci-bennch/$WORKSPACE/jureca"  # Directory to persistent files accessible from both login and compute nodes
  BUILDER_DIR: "$$WORKSPACE_DIR/builder/"                              # Path to builder installation
  CB_RUNNER_ACCOUNT: $CB_JURECA_RUNNER_ACCOUNT
  CB_PROJECT: $CB_JURECA_PROJECT

.preparation-tags:
  tags:
    - shell
    - jurecadc
    - jacamar

.benchmark-tags:
  tags:
    - shell  # compute
    - jurecadc
    - jacamar

.environment-init:
  - |+
    module load Stages/2023 Python/3.10.4 PyYAML/6.0
    jutil env activate -p $CB_PROJECT

.preparation-init:
  - |+
    module load Stages/2023 git/2.36.0-nodocs
    # Install git-annex
    cd $USER_DATA_DIR
    wget "http://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz" -O git-annex.tar.gz -q
    tar -xzf git-annex.tar.gz -C $GIT_ANNEX_DIR --strip-components 1
    rm git-annex.tar.gz
    export PATH=$PATH:$GIT_ANNEX_DIR

.benchmarks-init:
  - |+
    module load JUBE/2.5.1 git/2.36.0-nodocs

.results-init:
  - |+
    module load Stages/2023 Python/3.10.4 PyYAML/6.0 SciPy-bundle/2022.05 matplotlib/3.5.2 git/2.36.0-nodocs IPython/8.5.0
    export PATH=$PATH:$GIT_ANNEX_DIR
