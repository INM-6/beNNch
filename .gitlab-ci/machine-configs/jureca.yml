.front:
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:10:00
    CB_JOB_MEM: "16G"
  tags:
    - shell
    - jureca
    - jacamar

.compute:
  variables:
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=$CB_BUILD_TIME_LIMIT --nodes=$CB_NUMNODES"
    CB_NUMNODES: 1
    #CB_JOB_TIME_LIMIT: 00:10:00
    #CB_JOB_MEM: "16G"
  tags:
    - compute
    - jureca
    - jacamar

.initialise:
  script:
    - 'jutil env activate -p cjinb33'
    - 'jutil env activate -p djinb33'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - 'module load $MODULE_LIST'
    - 'python -m venv --system-site-packages benchmarking-env'
    - 'benchmarking-env/bin/pip install $PIP_LIST'
    - 'ls -al'

variables:
    TEMP_DIR: "$$SCRATCH_cjinb33/ci-bennch/jureca/userdata"
    extra_sbatch_flags: "--disable-turbomode --disable-perfparanoid"
    extra_srun_flags: "--cpu-bind=mask_cpu:0xFFFFFFFFFFFFFFFF,0xFFFFFFFFFFFFFFFF0000000000000000"
    CUSTOM_CI_BUILDS_DIR: "/p/scratch/cjinb33/.jacamar-ci/"

.environment-load:
  before_script:
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'jutil env activate -p cjinb33'
    - 'jutil env activate -p djinb33'
    - 'export PYTHONNOUSERSITE=1'
    - 'module load $MODULE_LIST'
    - 'source benchmarking-env/bin/activate'
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
