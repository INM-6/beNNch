include: .gitlab-ci/jacamar-benchmarking.yml

.preparation:
  tags:
    - shell
    - jusuf
    - jacamar

.build:
  variables:
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=$CB_BUILD_TIME_LIMIT --nodes=1"
  tags:
    - compute
    - jusuf
    - jacamar

.benchmark:
  tags:
    - shell
    - jusuf
    - jacamar

.transfer:
  variables:
    CB_STORAGE_DIR: "/work/datasets/bennch/data"
  tags:
    - hambach

variables:
    TEMP_DIR: "$$SCRATCH_cjinb33/ci-bennch/jusuf/userdata"
    extra_sbatch_flags: "--disable-turbomode"
    extra_srun_flags: "--cpu-bind=mask_cpu:0xFFFFFFFFFFFFFFFF,0xFFFFFFFFFFFFFFFF0000000000000000"

.environment-init:
  - 'export PYTHONNOUSERSITE=1'

.environment-load:
  - 'export PYTHONNOUSERSITE=1'
