include: .gitlab-ci/jacamar-benchmarking.yml

variables:
  TEMP_DIR: "$$SCRATCH/ci-bennch/$WORKSPACE/jusuf/userdata"   # Directory to temporary files accessible from both login and compute nodes
  WORKSPACE_DIR: "$$USERSOFTWARE/ci-bennch/$WORKSPACE/jusuf"  # Directory to persistent files accessible from both login and compute nodes
  BUILDER_DIR: "$$WORKSPACE_DIR/builder"                       # Path to builder installation
  GIT_ANNEX_DIR: "$$WORKSPACE_DIR/git-annex"                   # Path to git-annex
  BENNCHPLOT_DIR: "$$WORKSPACE_DIR/bennchplot"                 # Path to beNNch-plot

.preparation:
  tags:
    - shell
    - jusuf
    - jacamar

.build:
  variables:
    # TODO: How much time is really required here? Should this also be a config parameter maybe?
    SCHEDULER_PARAMETERS: "--account=$CB_RUNNER_ACCOUNT --time=00:15:00 --nodes=1"
  tags:
    - compute
    - jusuf
    - jacamar

.benchmark:
  tags:
    - shell
    - jusuf
    - jacamar

.environment-init:
  - 'jutil env activate -p "$CB_DATA_PROJECT"'
  - 'jutil env activate -p "$CB_COMPUTE_PROJECT"'
  - 'export PATH="$PATH:$GIT_ANNEX_DIR"'

