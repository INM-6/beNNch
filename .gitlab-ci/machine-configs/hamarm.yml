.front:
  before_script:
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - |
      if [[ -n "$PIP_LIST" ]]; then
        python -m venv --system-site-packages benchmarking-env
        source benchmarking-env/bin/activate
        benchmarking-env/bin/pip download $PIP_LIST --dest ./pip-packages
        benchmarking-env/bin/pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --account=$CB_RUNNER_ACCOUNT --time=$CB_JOB_TIME_LIMIT --nodes=$CB_NUMNODES"
    CB_NUMNODES: 1
    CB_JOB_TIME_LIMIT: 00:10:00
    CB_RUNNER_ACCOUNT: hamarm
    CB_JOB_MEM: "8G"
  tags:
    - hambach

.compute:
  before_script:
    - 'module load $MODULE_LIST'
    - 'eval TEMP_DIR="$TEMP_DIR"'
    - 'export PYTHONNOUSERSITE=1'
    - |
      if [[ -n "$PIP_LIST" ]]; then
        python -m venv --system-site-packages benchmarking-env
        source compute-env/bin/activate
        benchmarking-env/bin/pip install --no-index --find-links=${CI_PROJECT_DIR}/pip-packages ${CI_PROJECT_DIR}/pip-packages/*
      fi
    - 'export PATH="$(pwd):$PATH"'
    - 'ls -al'
  variables:
    SCHEDULER_PARAMETERS: "--partition=$CB_PARTITION --mem=$CB_JOB_MEM --time=$CB_BUILD_TIME_LIMIT --nodes=$CB_NUMNODES --exclusive"
    CB_NUMNODES: 1
    CB_RUNNER_ACCOUNT: hamarm
    CB_JOB_MEM: "8G" 
  tags:
    - hambach

variables:
  CUSTOM_CI_BUILDS_DIR: "/work/users/.jacamar-ci"
  TEMP_DIR: "/work/users"
  extra_srun_flags: "--ntasks=1 --cpus-per-task=128"
  extra_sbatch_flags: "--exclusive"
