default:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://gitlab.jsc.fz-juelich.de

variables:
  BENCHMARK_ID:
    description: "Label given to the CI pipeline to identify a benchmark."
    value: "My Benchmark"
  CONFIG_REPO:
    description: "Configuration repository to use for benchmarking."
    value: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.jsc.fz-juelich.de/nest/bennch/configs/configs.git"
  CONFIG_BRANCH:
    description: "Configuration repository branch to use for benchmarking."
    value: "hambach"
  CONFIG_PATH:
    description: "Path to configuration file (e.g. config.yml) relative to the config repository root."
    value: "config.yml"
  RESULTS_REPO_URL:
    description: "Repository to upload benchmark results to."
    value: "/p/largedata2/djinb33/shared/annex-test-repo"
    # value: "https://gin.g-node.org/janvog/CI-beNNch-results.git"
    # value: "https://gin.g-node.org/janvog/CI-Bennch-results-devel"
  RESULTS_BRANCH:
    description: "Branch of result repository to upload benchmark results to."
    value: "main"
  RESULTS_PATH:
    description: "Path to results directory relative to results repository root."
    value: "."
  # RESULTS_REPO_TOKEN:
  #   description: "Access token for results repository in order to access repository via https."
  #   value: "$GIN_GNODE_TOKEN"
  EXTRA_CMAKE_FLAGS:
    description: "Any extra CMake flags which should be used to compile NEST. Only single quotes allowed! Multiple values for a single parameter must be single quoted and separated by semicolons."
    value: "-Dwith-optimize='-O3;-march=native' -Dwith-defines='-DNDEBUG' -Dwith-ltdl=ON -Dwith-boost=ON"
  DETAILED_TIMERS_FLAG:
    description: "Determines whether detailed timers are shown."
    value: "OFF"
    options:
      - "OFF"
      - "ON"
  PLOTTING_STYLE:
    description: "Setting this to docs will set detailed timers to OFF and will instead plot the realtime factor"
    value: "Standard"
    options:
      - "Standard"
      - "Docs"
  CB_MODELS:
    description: "Comma-seperated list of the names of all models for which benchmarks should be run. Leave empty to run benchmarks for all models specified in the configuration file."
    value: "microcircuit"
    options:
      - "hpc_benchmark"
      - "multi_area"
      - "microcircuit"
  CB_MACHINES:
    description: "Comma-seperated list of the names of all machines on which benchmarks should be run. Leave empty to trigger benchmark runs for manually for each individual machine for which configuration was found."
    value: "hambach"
    options:
      - "hambach"
      - "jusuf"
      - "jureca"
      - "juwels"

# Specify all machines for which configurations exist
.machines: &machines_anchor [ "hambach", "jureca", "jusuf" ]

# Only run pipelines manually triggered from the web
workflow:
  name: $BENCHMARK_ID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'


stages: [ validate, benchmarking ]


Validate Input:
  tags: [ "public-docker" ]  # any runner with internet connection and support for alpine image
  stage: validate
  image: python:3-alpine
  variables:
    MACHINES: "hambach,jureca,jusuf"  # TODO: Check if the anchor can be used here somehow to avoid duplication
  script:
    - |+
      # Make sure values were provided for all mandatory variables
      for var in BENCHMARK_ID CONFIG_REPO CONFIG_BRANCH CONFIG_PATH RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH ; do  # RESULTS_REPO_TOKEN
        eval val=\$"$var"
        if [ -z "$val" ] ; then
          echo "No value provided for variable ${var}!"
          exit 1
        fi
      done
    - 'apk update && apk add git'
    - 'python -m pip install pyyaml'
    - |
      if [ -z "$CB_MACHINES" ] ; then
        export CB_MANUAL="1"
      else
        export CB_MANUAL="0"
      fi
    - 'mkdir "$CI_PROJECT_DIR/tmp"'
    - 'export CB_MACHINES=$(python "$CI_PROJECT_DIR/.gitlab-ci/scripts/patch_config.py" "$CI_PROJECT_DIR/tmp" "$CI_PROJECT_DIR/config.yml" "$CI_PROJECT_DIR/simulator.planfile" "$CI_PROJECT_DIR/simulator.module" "$CONFIG_REPO" "$CONFIG_BRANCH" "$CONFIG_PATH")'
    - 'rm -rf $CI_PROJECT_DIR/tmp'
    - 'mkdir "$CI_PROJECT_DIR/pipelines"'
    - 'python "$CI_PROJECT_DIR/.gitlab-ci/scripts/prepare_machine_pipelines.py" "$CI_PROJECT_DIR/.gitlab-ci/machine-configs" "$CI_PROJECT_DIR/pipelines" "$CI_PROJECT_DIR/config.yml" "$MACHINES"'
  artifacts:
    paths:
      - "config.yml"
      - "simulator.module"
      - "simulator.planfile"
      - "pipelines"
    when: on_success


Trigger:
  stage: benchmarking
  allow_failure: true
  needs:
    - job: "Validate Input"
      artifacts: true
  parallel:
    matrix:  # Add all machines here for which configurations exist.
      - CB_MACHINE: *machines_anchor
  trigger:
    strategy: depend
    include:
      - artifact: pipelines/${CB_MACHINE}.yml
        job: "Validate Input"
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
