default:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://gitlab.jsc.fz-juelich.de
    CI_JOB_JWT:
      aud: https://gitlab.jsc.fz-juelich.de

variables:
  BENCHMARK_ID:
    description: "Label given to the CI pipeline to identify a benchmark."
    value: "My Benchmark"
  CONFIG_REPO:
    description: "Configuration repository to use for benchmarking."
    value: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.jsc.fz-juelich.de/nest/bennch/configs/configs.git"
  CONFIG_BRANCH:
    description: "Configuration repository branch to use for benchmarking."
    value: "restructure"
  CONFIG_PATH:
    description: "Path to configuration file (e.g. config.yml) relative to the config repository root."
    value: "config.yml"
  RESULTS_REPO_URL:
    description: "Repository to upload benchmark results to."
    value: "/p/largedata2/djinb33/shared/annex-test-repo"
  RESULTS_BRANCH:
    description: "Branch of result repository to upload benchmark results to."
    value: "main"
  RESULTS_PATH:
    description: "Path to results directory relative to results repository root."
    value: "."
  EXTRA_CMAKE_FLAGS:
    description: "Any extra CMake flags which should be used to compile NEST. Only single quotes allowed! Multiple values for a single parameter must be single quoted and separated by semicolons."
    value: "-Dwith-optimize='-O3;-march=native' -Dwith-defines='-DNDEBUG' -Dwith-ltdl=ON -Dwith-boost=ON"
  DETAILED_TIMERS_FLAG:
    description: "Determines whether detailed timers are shown."
    value: "OFF"
    options:
      - "OFF"
      - "ON"
  MPI_FLAG:
    description: "Determines whether nest is compiled with mpi"
    value: "ON"
    options:
      - "OFF"
      - "ON"
  PLOTTING_STYLE:
    description: "Setting this to docs will set detailed timers to OFF and will instead plot the realtime factor"
    value: "Standard"
    options:
      - "Standard"
      - "Docs"
  CB_MODELS:
    description: "Name of model for which benchmarks should be run."
    value: "microcircuit"
    options:
      - "hpc_benchmark"
      - "multi_area"
      - "microcircuit"
  CB_MACHINES:
    description: "Machine on which benchmarks should be run."
    value: "jureca"
    options:
      - "hambach"
      - "jusuf"
      - "jureca"
      - "juwels"
      - "hamarm"
  CB_STORAGE_MACHINE:
    description: "Runner Tags of the storage machine"
    value: "hambach"
  CB_STORAGE_DIR:
    description: "Directory of the bare repository in the CB_STORAGE_MACHINE"
    value: "/work/datasets/bennch-data"
  FF_SCRIPT_SECTIONS: "true"    # see https://docs.gitlab.com/runner/configuration/feature-flags.html#available-feature-flags
  FF_TIMESTAMPS: "true"
  #FF_ENABLE_JOB_CLEANUP: "true"  # project directory will be deleted at the end of each job

# Only run pipelines manually triggered from the web
workflow:
  name: $BENCHMARK_ID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'

stages: [ validate, benchmarking ]

Validate Input:
  tags: [ "public-docker" ]  # any runner with internet connection and support for alpine image
  stage: validate
  image: python:3-alpine
  script:
    - |+
      # Make sure values were provided for all mandatory variables
      for var in BENCHMARK_ID CONFIG_REPO CONFIG_BRANCH CONFIG_PATH RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH ; do  # RESULTS_REPO_TOKEN
        eval val=\$"$var"
        if [ -z "$val" ] ; then
          echo "No value provided for variable ${var}!"
          exit 1
        fi
      done
    - 'apk update && apk add git util-linux'
    - 'python -m pip install pyyaml'
    - 'mkdir "$CI_PROJECT_DIR/tmp"'
    - 'python "$CI_PROJECT_DIR/.gitlab-ci/scripts/patch_config.py" "$CI_PROJECT_DIR/tmp" "$CI_PROJECT_DIR/config.yml" "$CI_PROJECT_DIR/simulator.planfile" "$CI_PROJECT_DIR/simulator.module" "$CONFIG_REPO" "$CONFIG_BRANCH" "$CONFIG_PATH"'
    - 'rm -rf $CI_PROJECT_DIR/tmp'
    # calculate cpu bin mask so machine configs may pick it up if they need it
    - 'export CPU_BIND_MASK=$(python3 $CI_PROJECT_DIR/.gitlab-ci/scripts/pinning_mask.py $CB_THREADS_PER_TASK $CB_TASKS_PER_NODE)'
    - 'echo $CPU_BIND_MASK'
    - 'echo "CPU_BIND_MASK=$CPU_BIND_MASK" >> $CI_ENVIRONMENT_FILE'
    # merge config into machine config
    - 'mkdir $CI_PROJECT_DIR/prepared-machine-config'
    - 'python "$CI_PROJECT_DIR/.gitlab-ci/scripts/prepare_machine_pipelines.py" "$CI_PROJECT_DIR/.gitlab-ci/jacamar-benchmarking.yml" "$CI_PROJECT_DIR/prepared-jacamar-benchmarking.yml" "$CI_PROJECT_DIR/config.yml"'
    # merge machine config into main pipeline
    - "sed -e \"s/{{ CB_MACHINES }}/$CB_MACHINES/g\" prepared-jacamar-benchmarking.yml > add-machine-configs.yml"
    - "sed -e \"s/{{ CB_STORAGE_MACHINE }}/$CB_STORAGE_MACHINE/g\" add-machine-configs.yml > run-benchmarks.yml"
    - "cat run-benchmarks.yml"
    - "! grep '${CB_MACHINES}.yml' run-benchmarks.yml"
    - "ls -al"
  artifacts:
    paths:
      - "config.yml"
      - "simulator.module"
      - "simulator.planfile"
      - "run-benchmarks.yml"
    when: on_success

Trigger:
  stage: benchmarking
  allow_failure: true
  needs:
    - job: "Validate Input"
      artifacts: true
  trigger:
    strategy: depend
    include: 
      - artifact: run-benchmarks.yml
        job: "Validate Input"
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
