variables:
  BENCHMARK_ID:
    description: "Label given to the CI pipeline to identify a benchmark."
    value: "My Benchmark"
  SIMULATOR_REPO:
    description: "Simulator repository to use for benchmarking."
    value: "https://github.com/nest/nest-simulator"
  SIMULATOR_BRANCH:
    description: "Simulator repository branch to use for benchmarking."
    value: "master"
  CONFIG_REPO:
    description: "Configuration repository to use for benchmarking."
    value: "https://github.com/JanVogelsang/CI-Bennch-config.git"
  CONFIG_BRANCH:
    description: "Configuration repository branch to use for benchmarking."
    value: "main"
  CONFIG_PATH:
    description: "Path to configuration file (e.g. config.yml) relative to the config repository root."
    value: "config.yml"
  RESULTS_REPO_URL:
    description: "Repository to upload benchmark results to."
    value: "https://$GIN_GNODE_TOKEN@gin.g-node.org/Janvog/CI-Bennch-results-devel.git"
  RESULTS_BRANCH:
    description: "Branch of result repository to upload benchmark results to."
    value: "master"
  RESULTS_PATH:
    description: "Path to results directory relative to results repository root."
    value: "."
  WORKSPACE:
    description: "Benchmarking CI workflow type. Valid options are: 'production' or 'development'."
    value: "production"
  EXTRA_CMAKE_FLAGS:
    description: "Any extra CMake flags which should be used to compile NEST."
    value: '-Dwith-optimize=ON -Dwith-ltdl=ON -Dwith-boost=ON -Dwith-detailed-timers=ON'
  CB_MODELS:
    description: "Comma-seperated list of the names of all models which should be run. Leave empty to run benchmarks for all models specified in the configuration file."
    value: "hpc_benchmark"


# Specify all machines for which configurations exist
.machines: &machines_anchor [ "jureca", "jusuf" ]

# Only run pipelines manually triggered from the web
workflow:
  name: $BENCHMARK_ID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'


stages: [ validate, benchmarking ]


Validate Input:
  # TODO: Is it better to use a shared runner?
  tags: [ "public-docker" ]  # any runner with internet connection and support for alpine image
  stage: validate
  image: python:3-alpine
  variables:
    MACHINES: "jureca,jusuf"  # TODO: Check if the anchor can be used here somehow to avoid duplication
  script:
    - |+
      # Make some values were provided for all mandatory variables
      for var in BENCHMARK_ID SIMULATOR_REPO SIMULATOR_BRANCH CONFIG_REPO CONFIG_BRANCH CONFIG_PATH RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH WORKSPACE ; do
        eval val=\$$var
        if [ -z $val ] ; then
          echo "No value provided for variable ${var}!"
          exit 1
        fi
      done
    - 'apk update && apk add git'
    - 'python -m pip install pyyaml'
    - 'mkdir "$CI_PROJECT_DIR/tmp" '
    - 'python "$CI_PROJECT_DIR/.gitlab-ci/scripts/patch_config.py" "$CI_PROJECT_DIR/tmp" "$CI_PROJECT_DIR/config.yml" "$CONFIG_REPO" "$CONFIG_BRANCH" "$CONFIG_PATH"'
    - 'mkdir "$CI_PROJECT_DIR/pipelines"'
    - 'python "$CI_PROJECT_DIR/.gitlab-ci/scripts/prepare_machine_pipelines.py" "$CI_PROJECT_DIR/.gitlab-ci/machine-configs" "$CI_PROJECT_DIR/pipelines" "config_repository/$CONFIG_PATH" "$MACHINES"'
  artifacts:
    paths:
      - "config.yml"
      - "pipelines"
    reports:
      dotenv:
        - "variables.env"
    when: on_success


Trigger:
  stage: benchmarking
  allow_failure: true
  needs:
    - job: "Validate Input"
      artifacts: true
  parallel:
    matrix:  # Add all machines here for which configurations exist. TODO: Add option to specify the runner
      - CB_MACHINE: *machines_anchor
  trigger:
    strategy: depend
    include:
      - artifact: pipelines/${CB_MACHINE}.yml
        job: "Validate Input"
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
