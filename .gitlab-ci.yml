variables:
  SIMULATOR_REPO:
    description: "Simulator repository to use for benchmarking."
    value: "https://github.com/nest/nest-simulator.git"
  SIMULATOR_BRANCH:
    description: "Simulator repository branch to use for benchmarking."
    value: "master"
  CONFIG_REPO:
    description: "Configuration repository to use for benchmarking."
    value: "https://github.com/JanVogelsang/CI-Bennch-config.git"
  CONFIG_BRANCH:
    description: "Configuration repository branch to use for benchmarking."
    value: "main"
  CONFIG_PATH:
    description: "Path to configuration file (e.g. config.yml) relative to the config repository root."
    value: "config.yml"
  RESULTS_REPO_URL:
    description: "Repository to upload benchmark results to."
    value: "https://gin.g-node.org/Janvog/CI-Bennch-results-devel.git"
  RESULTS_BRANCH:
    description: "Branch of result repository to upload benchmark results to."
    value: master
  RESULTS_PATH:
    description: "Path to results directory relative to results repository root."
  WORKSPACE:
    description: "Benchmarking CI workflow type. Valid options are: 'production' or 'development'."
    value: "production"
  EXTRA_CMAKE_FLAGS:
    description: "[Optional] Any extra CMake flags which should be used to compile NEST."
  CB_MODELS:
    description: "[Optional] Comma-seperated list of the names of all models which should be run."


.machines: &machines_anchor [ "jureca", "hifis" ]

# Only run pipelines manually triggered from the web
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'


stages: [ validate, benchmarking ]


Validate Input:
  tags: [ "public-docker" ]  # any shared runner with internet connection and support for alpine image
  stage: validate
  image: python:3-alpine
  variables:
    MACHINES: "jureca,hifis"  # TODO: Check if the anchor can be used here somehow to avoid duplication
  script:
    - 'apk update && apk add git'
    - |+
      # Make some values were provided for all mandatory variables
      for var in SIMULATOR_REPO SIMULATOR_BRANCH CONFIG_REPO CONFIG_BRANCH CONFIG_PATH RESULTS_REPO_URL RESULTS_BRANCH RESULTS_PATH WORKSPACE ; do
        echo "var $(eval \$$var)"
        if [ -z $(eval \$$var) ] ; then
          echo "No value provided for variable ${var}!"
          exit 1
        fi
      done
    - 'exit 1'
    - 'git clone --single-branch --branch=$SOURCE_BRANCH --depth=1 $SOURCE_REPO repository'
    - 'git clone --single-branch --branch=$CONFIG_BRANCH --depth=1 $CONFIG_REPO config_repository'
    - 'python -m pip install pyyaml'
    - 'echo $MACHINES'
    - 'python $CI_PROJECT_DIR/.gitlab-ci/scripts/prepare_machines.py config_repository/$CONFIG_PATH model_repos $MACHINES variables.env'
  artifacts:
    paths:
      - "repository"
      - "config_repository"
      - "model_repos"
    exclude:
      - "*/*/.git"
    reports:
      dotenv:
        - "variables.env"
    when: on_success



Trigger:
  stage: benchmarking
  allow_failure: true
  needs:
    - job: "validate"
      artifacts: true
  parallel:
    matrix:  # Add all machines here for which configurations exist. TODO: Add option to specify the runner
      # - MACHINE: !reference [ .machines ]
      - MACHINE: *machines_anchor
  trigger:
    include: .gitlab-ci/machine-configs/${MACHINE}.yml
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
