
stages:
  - prepare
  - test
  - finalize

# These variables are resolved when the job is built, so some environment variables are not available
variables:
  WORKSPACE: "ci-bennch"
  REPO_DIRS: "$$PROJECT/$WORKSPACE"
  BUILD_PATH: "$$SCRATCH/$WORKSPACE"
  INSTALL_PATH: "$$USERSOFTWARE_djinb33/$WORKSPACE/$$MACHINE/install"
  MODULE_PATH: "$$USERSOFTWARE_djinb33/$WORKSPACE/$$MACHINE/modules"
  STAGEIN_DIRS: "$(date)/$WORKSPACE/transit-in"
  STAGEOUT_DIRS: "$$DATA/$WORKSPACE/transit-in"
  RESULT_SYNC_URL: "https://gin.g-node.org/nest/beNNch-results.git"

.jureca:
  tags:
    - jurecadc
    - jacamar
    - slurm

.juwels:
  tags:
    - juwels
    - jacamar
    - slurm

.JSC-baseenv:
  before_script:
    - module load git
    #- "export MACHINE=\"$(< /etc/FZJ/systemname)\""

.compute-node:
  extends: [ .JSC-baseenv ]
  variables:
    #SCHEDULER_PARAMETERS: --account jinb33 --partition dc-gpu --time 00:01:00 --gres=gpu:1 -n 1
    SCHEDULER_PARAMETERS: --account jinb33 --time 00:01:00 -n 1

.front-node:
  extends: [ .JSC-baseenv ]
  variables:
    #SCHEDULER_PARAMETERS: --account jinb33 --partition dc-gpu --time 00:01:00 --gres=gpu:1 -n 1
    SCHEDULER_PARAMETERS: "--account jinb33 $(hostname >&2) --partition dc-cpu --time 00:01:00 -n 1"

stage-in:
  stage: prepare
  parallel:
    matrix:
      - MACHINE: jurecadc
           INCLUDES: [.front-node]
      - MACHINE: juwels
           INCLUDES: [.front-node]
  extends: [ .${MACHINE}, *${INCLUDES} ]
  rules:
    - if: $(MACHINE) == jurecadc
  script:
    - hostname
    - ls -l
    - set
    - pwd
    - 'eval $BUILD_PATH'
    - 'eval $INSTALL_PATH'
    - 'eval $MODULE_PATH'
    - 'eval $STAGEIN_DIRS'
    - 'eval $STAGEOUT_DIRS'
    - 'echo $WORKSPACE'
    - 'echo $REPO_DIRS'
    - 'echo $BUILD_PATH'
    - 'echo $INSTALL_PATH'
    - 'echo $MODULE_PATH'
    - 'echo $STAGEIN_DIRS'
    - 'echo $STAGEOUT_DIRS'
    - 'echo $RESULT_SYNC_URL'
    #- git clone --depth 1 https://github.com/nest/nest-simulator
    #- rm -rf nest-simulator

Benchmarking:
  stage: test    # It only starts when the job in the build stage completes successfully.
  extends: [ .jureca, .compute-node ]
  tags:
    - jurecadc
    - jacamar
  script:
    - hostname
    - ls -l
    - set
    - pwd
    #- set -eo pipefail
    #- set -x
    - 'echo "Workflow configured with the following base settings:"'
    - 'echo "WORKSPACE: $WORKSPACE"'
    - 'echo "REPO_DIRS: $REPO_DIRS"'
    - 'echo "BUILD_PATH: $BUILD_PATH"'
    - 'echo "INSTALL_PATH: $INSTALL_PATH"'
    - 'echo "MODULE_PATH: $MODULE_PATH"'
    - 'echo "STAGEIN_DIRS: $STAGEIN_DIRS"'
    - 'echo "STAGEOUT_DIRS: $STAGEOUT_DIRS"'
    - 'echo "RESULT_SYNC_URL: $RESULT_SYNC_URL"'
